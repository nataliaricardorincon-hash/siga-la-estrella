<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Siga la estrella! · HSEQ ANAVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--rojo:#F30000;--vino:#940000;--marron:#4F0000;--oro:#F2B705;--oro2:#FFD54A;--navy:#14244F;--gris:#4D4D4D;--gris2:#999;--borde:#E2E2E2;--fondo:#F6F4F1;--ok:#1E7B34;--warn:#B35900}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:var(--fondo);color:#1d1d1d}
header.top{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top .marca{font-weight:900;letter-spacing:1px}
header.top .marca span{color:var(--oro2)}
header.top small{opacity:.8;font-weight:600}
main{max-width:980px;margin:0 auto;padding:18px}
.card{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:18px;margin-bottom:16px}
h1{font-size:28px;margin:0 0 6px;font-weight:900;color:var(--navy)}
h2{font-size:20px;margin:0 0 12px;color:var(--navy)}
h3{font-size:16px;margin:16px 0 8px}
p{line-height:1.5}
.muted{color:var(--gris)}
.hero{background:linear-gradient(160deg,#1b2f66,#0f1c3d);color:#fff;border:none;text-align:center;padding:28px 18px}
.hero h1{color:#fff;font-size:34px}
.hero .star{font-size:64px;line-height:1;color:var(--oro2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:2px solid transparent;font:700 15px Montserrat,sans-serif;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--rojo);color:#fff}
.btn.pri:hover{background:var(--vino)}
.btn.sec{background:#fff;color:var(--navy);border-color:var(--navy)}
.btn.oro{background:var(--oro2);color:var(--navy)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.ok{background:var(--ok);color:#fff}
.btn.no{background:#fff;color:var(--rojo);border-color:var(--rojo)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #ccc;border-radius:10px;font:500 15px Montserrat,sans-serif;background:#fff}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid #ffd54a;border-color:var(--navy)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:8px 14px;font:700 14px Montserrat,sans-serif;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--navy);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--borde);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.tag.pend{background:#FFF3D6;color:var(--warn)}
.tag.val{background:#E2F3E6;color:var(--ok)}
.tag.rec{background:#FDE2E2;color:var(--vino)}
.banner{padding:12px 14px;border-radius:12px;font-weight:600;margin-bottom:14px}
.banner.demo{background:#FFF3D6;color:#6b4300;border:1px solid #f1d38a}
.banner.err{background:#FDE2E2;color:var(--vino)}
.banner.okb{background:#E2F3E6;color:var(--ok)}
.reglas li{margin:6px 0}
.foto{max-width:220px;max-height:220px;border-radius:10px;border:1px solid var(--borde);display:block}
.esperado{background:#F2F6FF;border:1px solid #cfdcff;border-radius:10px;padding:10px;font-size:14px}
.punt{display:flex;gap:6px;flex-wrap:wrap}
.punt button{border:2px solid var(--navy);background:#fff;border-radius:10px;padding:6px 10px;font:700 13px Montserrat;cursor:pointer;color:var(--navy)}
.punt button[aria-pressed="true"]{background:var(--navy);color:#fff}
.podio{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.podio div{background:#fff;border:2px solid var(--oro);border-radius:14px;padding:12px;text-align:center}
.podio b{display:block;font-size:26px;color:var(--navy)}
.big{font-size:44px;font-weight:900;color:var(--rojo);line-height:1}
.hidden{display:none!important}
footer{text-align:center;color:var(--gris2);font-size:12px;padding:20px}
/* hoja de impresión */
#print{display:none}
@media print{
  body{background:#fff}
  header.top,main,footer{display:none!important}
  #print{display:block}
  .hoja{page-break-after:always;display:grid;grid-template-columns:1fr 1fr;gap:10mm;padding:8mm}
  .est{border:1px dashed #999;border-radius:6mm;padding:5mm;text-align:center;height:120mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3mm}
  .est .n{font:900 34pt Montserrat;color:#F30000}
  .est .t{font:800 14pt Montserrat;color:#14244F}
  .est .s{font:600 9pt Montserrat;color:#333}
  .est svg.estrella{width:28mm;height:28mm}
  .est .qr img,.est .qr svg{width:42mm;height:42mm}
}
</style>
</head>
<body>
<header class="top">
  <div><div class="marca">¡SIGA LA <span>ESTRELLA</span>!</div><small>Campaña HSEQ · Reyes · Grupo ANAVA</small></div>
  <a class="btn sm oro" href="#" id="lnkInicio">Inicio</a>
</header>
<main id="app" aria-live="polite"></main>
<div id="print" aria-hidden="true"></div>
<footer>HSEQ · Grupo ANAVA · Temporada decembrina 2026–2027</footer>

<script type="module">
/* ================== CONFIGURACIÓN ==================
   1) Pega aquí la configuración de tu proyecto Firebase (Configuración del proyecto › Tus apps › Web).
   2) Mientras apiKey diga "PEGAR_AQUI", la app funciona en MODO DEMO (datos solo en este navegador). */
const firebaseConfig = {
  apiKey: "AIzaSyBzwD7c3joMNwl_WvLVHcSSsRTLCVbDu4A",
  authDomain: "sigue-la-estrella.firebaseapp.com",
  projectId: "sigue-la-estrella",
  storageBucket: "sigue-la-estrella.firebasestorage.app",
  messagingSenderId: "826562823846",
  appId: "1:826562823846:web:fde238c40dbbe471ef9667"
};
const PUNTOS = { hallazgo: 10, primero: 5, condicion: [0, 10], accion: [0, 5, 10] };
/* ================================================== */

const DEMO = !firebaseConfig.apiKey || firebaseConfig.apiKey === "PEGAR_AQUI";
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const token = (n = 12) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
async function sha(t) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("anava-estrella:" + t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
const fmt = (ts) => ts ? new Date(ts).toLocaleString("es-CO", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "";

/* ---------- Capa de datos: demo (localStorage) o Firestore ---------- */
let DB;
if (DEMO) {
  const K = "siga-estrella-demo";
  const load = () => { try { return JSON.parse(localStorage.getItem(K)) || {}; } catch { return {}; } };
  const save = (d) => { try { localStorage.setItem(K, JSON.stringify(d)); } catch (e) { alert("El navegador no deja guardar más datos de prueba."); } };
  DB = {
    async get(c, id) { return (load()[c] || {})[id] || null; },
    async set(c, id, v) { const d = load(); d[c] = d[c] || {}; d[c][id] = { ...v, id }; save(d); },
    async update(c, id, v) { const d = load(); d[c] = d[c] || {}; d[c][id] = { ...(d[c][id] || {}), ...v, id }; save(d); },
    async add(c, v) { const id = token(16); await this.set(c, id, v); return id; },
    async del(c, id) { const d = load(); if (d[c]) delete d[c][id]; save(d); },
    async where(c, f, val) { return Object.values(load()[c] || {}).filter(x => x[f] === val); },
    async all(c) { return Object.values(load()[c] || {}); }
  };
} else {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const db = fs.getFirestore(initializeApp(firebaseConfig));
  const snap = (s) => s.docs.map(d => ({ ...d.data(), id: d.id }));
  DB = {
    async get(c, id) { const s = await fs.getDoc(fs.doc(db, c, id)); return s.exists() ? { ...s.data(), id: s.id } : null; },
    async set(c, id, v) { await fs.setDoc(fs.doc(db, c, id), v); },
    async update(c, id, v) { await fs.updateDoc(fs.doc(db, c, id), v); },
    async add(c, v) { const r = await fs.addDoc(fs.collection(db, c), v); return r.id; },
    async del(c, id) { await fs.deleteDoc(fs.doc(db, c, id)); },
    async where(c, f, val) { return snap(await fs.getDocs(fs.query(fs.collection(db, c), fs.where(f, "==", val)))); },
    async all(c) { return snap(await fs.getDocs(fs.collection(db, c))); }
  };
}

/* ---------- Sesión (PIN) ---------- */
const S = { rol: null, centroId: null };

/* ---------- Utilidades de vista ---------- */
function view(html) { app.innerHTML = (DEMO ? `<div class="banner demo">Modo demostración: los datos se guardan solo en este navegador. Para usarla a nivel nacional, conecta Firebase (ver instrucciones).</div>` : "") + html; window.scrollTo(0, 0); }
function msg(el, texto, tipo = "err") { el.innerHTML = `<div class="banner ${tipo}">${esc(texto)}</div>`; }
const STAR_SVG = `<svg class="estrella" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4l13.6 29.6 32.4 3.7-24 22.1 6.6 32L50 75.4 21.4 91.4l6.6-32-24-22.1 32.4-3.7z" fill="#F2B705" stroke="#B37F00" stroke-width="3"/></svg>`;
async function config() { return (await DB.get("config", "app")) || null; }
function abierta(cfg) {
  if (!cfg) return { ok: false, motivo: "La actividad todavía no está configurada." };
  if (!cfg.abierta) return { ok: false, motivo: "La búsqueda de estrellas está cerrada en este momento." };
  const now = Date.now();
  if (cfg.inicio && now < Date.parse(cfg.inicio)) return { ok: false, motivo: "La búsqueda empieza el " + new Date(cfg.inicio).toLocaleString("es-CO") + "." };
  if (cfg.fin && now > Date.parse(cfg.fin)) return { ok: false, motivo: "La búsqueda ya cerró. ¡Gracias por participar!" };
  return { ok: true };
}

/* ---------- Puntaje ---------- */
function puntos(r) {
  if (r.estado !== "validado") return 0;
  return PUNTOS.hallazgo + (r.primero ? PUNTOS.primero : 0) + (r.pCond || 0) + (r.pAcc || 0);
}

/* ================== PANTALLAS ================== */

/* Inicio */
async function inicio() {
  const cfg = await config();
  if (!cfg) return primerUso();
  const est = abierta(cfg);
  view(`
  <section class="card hero">
    <div class="star">★</div>
    <h1>¡Siga la estrella!</h1>
    <p>Entre el 5 y el 7 de enero hay 10 estrellas escondidas en tu centro. Cada una marca una condición insegura simulada.</p>
    <p><b>${est.ok ? "La búsqueda está abierta." : esc(est.motivo)}</b></p>
  </section>
  <section class="card">
    <h2>Cómo se juega</h2>
    <ol class="reglas">
      <li><b>Encuentra la estrella</b> y escanea su código QR con tu celular.</li>
      <li><b>Identifica la condición insegura</b> que marca.</li>
      <li><b>Propón la acción correcta</b> y envíala con una foto.</li>
    </ol>
    <p class="muted">Busca solo en áreas seguras: sin subir a estanterías, sin entrar a vías de montacargas y nunca mientras operas un equipo. Si ves un riesgo real, repórtalo de inmediato.</p>
    <div class="row">
      <button class="btn pri" id="bRank">Ver ranking</button>
      <button class="btn sec" id="bHseq">Soy HSEQ de centro</button>
      <button class="btn sec" id="bAdm">Administración nacional</button>
    </div>
  </section>`);
  $("#bRank").onclick = ranking;
  $("#bHseq").onclick = () => login("hseq");
  $("#bAdm").onclick = () => login("admin");
}

/* Primer uso: crear PIN de administrador */
function primerUso() {
  view(`<section class="card"><h1>Configuración inicial</h1>
  <p>Crea el PIN del administrador nacional. Guárdalo bien: con él se crean los centros y se ve el ranking completo.</p>
  <label for="p1">PIN del administrador (mínimo 6 dígitos)</label><input id="p1" type="password" inputmode="numeric" autocomplete="new-password">
  <label for="p2">Repite el PIN</label><input id="p2" type="password" inputmode="numeric" autocomplete="new-password">
  <div id="m"></div><div class="row" style="margin-top:14px"><button class="btn pri" id="ok">Guardar</button></div></section>`);
  $("#ok").onclick = async () => {
    const a = $("#p1").value.trim(), b = $("#p2").value.trim();
    if (a.length < 6) return msg($("#m"), "El PIN debe tener al menos 6 dígitos.");
    if (a !== b) return msg($("#m"), "Los PIN no coinciden.");
    await DB.set("config", "app", { adminPin: await sha(a), abierta: false, inicio: "2027-01-05T06:00", fin: "2027-01-07T18:00", creado: Date.now() });
    S.rol = "admin"; admin();
  };
}

/* Login por PIN */
async function login(rol) {
  const centros = rol === "hseq" ? (await DB.all("centros")).sort((a, b) => a.nombre.localeCompare(b.nombre)) : [];
  view(`<section class="card"><h1>${rol === "admin" ? "Administración nacional" : "Ingreso HSEQ de centro"}</h1>
  ${rol === "hseq" ? `<label for="c">Centro de trabajo</label><select id="c"><option value="">Selecciona…</option>${centros.map(c => `<option value="${esc(c.id)}">${esc(c.nombre)}</option>`).join("")}</select>` : ""}
  <label for="p">PIN</label><input id="p" type="password" inputmode="numeric" autocomplete="current-password">
  <div id="m"></div><div class="row" style="margin-top:14px"><button class="btn pri" id="ok">Entrar</button><button class="btn sec" id="vol">Volver</button></div></section>`);
  $("#vol").onclick = inicio;
  $("#p").onkeydown = (e) => { if (e.key === "Enter") $("#ok").click(); };
  $("#ok").onclick = async () => {
    const pin = await sha($("#p").value.trim());
    if (rol === "admin") {
      const cfg = await config();
      if (cfg && cfg.adminPin === pin) { S.rol = "admin"; return admin(); }
    } else {
      const id = $("#c").value; if (!id) return msg($("#m"), "Selecciona tu centro.");
      const c = await DB.get("centros", id);
      if (c && c.pin === pin) { S.rol = "hseq"; S.centroId = id; return hseq(); }
    }
    msg($("#m"), "PIN incorrecto.");
  };
}

/* ---------- Participante: llegó por el QR de una estrella ---------- */
async function estrella(tk) {
  const e = await DB.get("estrellas", tk);
  if (!e) return view(`<section class="card"><h1>Estrella no encontrada</h1><p>Este código no corresponde a ninguna estrella activa. Avísale al HSEQ de tu centro.</p></section>`);
  const cfg = await config(); const est = abierta(cfg);
  const c = await DB.get("centros", e.centroId);
  if (!est.ok) return view(`<section class="card hero"><div class="star">★</div><h1>Estrella N.º ${e.numero}</h1><p>${esc(est.motivo)}</p></section>`);
  const equipos = (c?.equipos || []);
  view(`
  <section class="card hero"><div class="star">★</div><h1>¡Encontraste la estrella N.º ${e.numero}!</h1><p>${esc(c?.nombre || "")}</p></section>
  <section class="card">
    <h2>Registra tu hallazgo</h2>
    <label for="eq">Tu equipo</label>
    <select id="eq"><option value="">Selecciona tu equipo…</option>${equipos.map(q => `<option>${esc(q)}</option>`).join("")}</select>
    <label for="in">Integrantes presentes</label><input id="in" placeholder="Nombres de quienes la encontraron">
    <label for="co">¿Qué condición insegura ves?</label><textarea id="co" maxlength="500" placeholder="Describe lo que está mal y por qué es un riesgo"></textarea>
    <label for="ac">¿Qué acción propones?</label><textarea id="ac" maxlength="500" placeholder="¿Qué harías para corregirlo y evitar que pase?"></textarea>
    <label for="fo">Foto de la condición (opcional)</label><input id="fo" type="file" accept="image/*" capture="environment">
    <img id="pre" class="foto hidden" alt="Vista previa de la foto">
    <div id="m"></div>
    <div class="row" style="margin-top:14px"><button class="btn pri" id="env">Enviar hallazgo</button></div>
    <p class="muted" style="font-size:13px">Cada equipo puede registrar cada estrella una sola vez. El HSEQ de tu centro valida la respuesta.</p>
  </section>`);
  let foto = null;
  $("#fo").onchange = async (ev) => { const f = ev.target.files[0]; if (!f) return; foto = await comprimir(f); $("#pre").src = foto; $("#pre").classList.remove("hidden"); };
  $("#env").onclick = async () => {
    const eq = $("#eq").value, co = $("#co").value.trim(), ac = $("#ac").value.trim();
    if (!eq) return msg($("#m"), "Selecciona tu equipo.");
    if (co.length < 5 || ac.length < 5) return msg($("#m"), "Describe la condición y la acción propuesta.");
    $("#env").disabled = true;
    try {
      const prev = (await DB.where("registros", "estrella", tk));
      if (prev.some(r => r.equipo === eq)) { $("#env").disabled = false; return msg($("#m"), "Tu equipo ya registró esta estrella."); }
      await DB.add("registros", { estrella: tk, centroId: e.centroId, numero: e.numero, equipo: eq, integrantes: $("#in").value.trim().slice(0, 200), condicion: co, accion: ac, foto: foto || "", ts: Date.now(), estado: "pendiente", primero: prev.length === 0 });
      view(`<section class="card hero"><div class="star">★</div><h1>¡Hallazgo enviado!</h1><p>Equipo <b>${esc(eq)}</b> · Estrella N.º ${e.numero}</p><p>El HSEQ de tu centro lo validará. ¡Sigue buscando las demás estrellas!</p></section><div class="row"><button class="btn sec" id="rk">Ver ranking</button></div>`);
      $("#rk").onclick = ranking;
    } catch (err) { $("#env").disabled = false; msg($("#m"), "No se pudo enviar. Revisa tu conexión e intenta otra vez."); }
  };
}
function comprimir(file) {
  return new Promise((res) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const max = 800, k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement("canvas"); cv.width = img.width * k; cv.height = img.height * k; cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", 0.6)); };
    img.onerror = () => res(null); img.src = url;
  });
}

/* ---------- HSEQ de centro ---------- */
async function hseq(tab = "validar") {
  const c = await DB.get("centros", S.centroId);
  view(`<section class="card"><div class="row" style="justify-content:space-between"><div><h1>${esc(c.nombre)}</h1><p class="muted" style="margin:0">Panel HSEQ del centro</p></div><button class="btn sec sm" id="salir">Salir</button></div></section>
  <div class="tabs" role="group" aria-label="Secciones">
    <button data-t="validar" aria-pressed="${tab === "validar"}">Validar hallazgos</button>
    <button data-t="estrellas" aria-pressed="${tab === "estrellas"}">Mis 10 estrellas</button>
    <button data-t="equipos" aria-pressed="${tab === "equipos"}">Equipos</button>
    <button data-t="rank" aria-pressed="${tab === "rank"}">Ranking del centro</button>
  </div><div id="pane"></div>`);
  $("#salir").onclick = () => { S.rol = null; S.centroId = null; inicio(); };
  app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => hseq(b.dataset.t));
  const pane = $("#pane");
  if (tab === "equipos") return paneEquipos(pane, c);
  if (tab === "estrellas") return paneEstrellas(pane, c);
  if (tab === "rank") return paneRankCentro(pane, c);
  return paneValidar(pane, c);
}

async function paneEquipos(pane, c) {
  pane.innerHTML = `<section class="card"><h2>Equipos participantes</h2>
  <p class="muted">Un equipo por línea (por ejemplo: Turno A Bodega 1, Turno B Despachos). Recomendado: equipos de 3 a 5 personas.</p>
  <textarea id="eqs" style="min-height:180px">${esc((c.equipos || []).join("\n"))}</textarea>
  <div id="m"></div><div class="row" style="margin-top:12px"><button class="btn pri" id="g">Guardar equipos</button></div></section>`;
  $("#g").onclick = async () => { const eqs = $("#eqs").value.split("\n").map(s => s.trim()).filter(Boolean).slice(0, 40); await DB.update("centros", c.id, { equipos: eqs }); msg($("#m"), "Equipos guardados.", "okb"); };
}

async function paneEstrellas(pane, c) {
  const est = (await DB.where("estrellas", "centroId", c.id)).sort((a, b) => a.numero - b.numero);
  pane.innerHTML = `<section class="card"><h2>Mis 10 estrellas</h2>
  <p class="muted">Registra dónde escondes cada estrella, la condición insegura que simula y la acción correcta esperada. Solo lo ve el HSEQ del centro y la administración. Escóndelas el 4 de enero después del turno, solo en lugares de búsqueda segura.</p>
  ${est.length === 0 ? `<button class="btn pri" id="crear">Crear mis 10 estrellas</button>` : `
  <div class="row" style="margin-bottom:10px"><button class="btn oro" id="imp">Imprimir estrellas con QR</button></div>
  <table><thead><tr><th>N.º</th><th>Ubicación</th><th>Condición simulada</th><th>Acción esperada</th><th></th></tr></thead><tbody>
  ${est.map(e => `<tr><td><b>${e.numero}</b></td><td>${esc(e.ubicacion || "—")}</td><td>${esc(e.condicion || "—")}</td><td>${esc(e.accionEsperada || "—")}</td><td><button class="btn sec sm" data-ed="${esc(e.id)}">Editar</button></td></tr>`).join("")}
  </tbody></table>`}<div id="ed"></div></section>`;
  if (est.length === 0) $("#crear").onclick = async () => { for (let n = 1; n <= 10; n++) await DB.set("estrellas", token(), { centroId: c.id, numero: n, ubicacion: "", condicion: "", accionEsperada: "" }); hseq("estrellas"); };
  else {
    $("#imp").onclick = () => imprimir(c, est);
    pane.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => {
      const e = est.find(x => x.id === b.dataset.ed);
      $("#ed").innerHTML = `<div class="card" style="margin-top:14px;background:#FAFAFA"><h3>Estrella N.º ${e.numero}</h3>
      <label for="u">Ubicación</label><input id="u" value="${esc(e.ubicacion)}" placeholder="Ej.: pasillo 3, junto al extintor 12">
      <label for="cd">Condición insegura simulada</label><textarea id="cd" placeholder="Ej.: extintor obstruido por estibas">${esc(e.condicion)}</textarea>
      <label for="ae">Acción correcta esperada</label><textarea id="ae" placeholder="Ej.: despejar el acceso y señalizar zona libre de 1 m">${esc(e.accionEsperada)}</textarea>
      <div class="row" style="margin-top:12px"><button class="btn pri" id="gs">Guardar</button></div></div>`;
      $("#gs").onclick = async () => { await DB.update("estrellas", e.id, { ubicacion: $("#u").value.trim(), condicion: $("#cd").value.trim(), accionEsperada: $("#ae").value.trim() }); hseq("estrellas"); };
      $("#ed").scrollIntoView({ behavior: "smooth" });
    });
  }
}

let qrLib = null;
async function qrSVG(text) {
  if (!qrLib) await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"; s.onload = () => { qrLib = window.qrcode; res(); }; s.onerror = rej; document.head.appendChild(s); });
  const q = qrLib(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}
async function imprimir(c, est) {
  const base = location.href.split("?")[0].split("#")[0];
  let html = "";
  for (let i = 0; i < est.length; i += 4) {
    html += `<div class="hoja">`;
    for (const e of est.slice(i, i + 4)) {
      let qr = ""; try { qr = await qrSVG(base + "?s=" + e.id); } catch { qr = `<p>${esc(base + "?s=" + e.id)}</p>`; }
      html += `<div class="est">${STAR_SVG}<div class="n">${e.numero}</div><div class="t">¡Encontraste una estrella!</div><div class="qr">${qr}</div><div class="s">Escanea, identifica la condición insegura y propón la acción.<br>${esc(c.nombre)}</div></div>`;
    }
    html += `</div>`;
  }
  $("#print").innerHTML = html;
  setTimeout(() => window.print(), 300);
}

async function paneValidar(pane, c) {
  const regs = (await DB.where("registros", "centroId", c.id)).sort((a, b) => a.ts - b.ts);
  const est = Object.fromEntries((await DB.where("estrellas", "centroId", c.id)).map(e => [e.id, e]));
  const pend = regs.filter(r => r.estado === "pendiente");
  pane.innerHTML = `<section class="card"><h2>Hallazgos por validar (${pend.length})</h2>
  ${regs.length === 0 ? `<p class="muted">Todavía no hay hallazgos registrados.</p>` : regs.map(r => {
    const e = est[r.estrella] || {};
    return `<div class="card" style="background:#FCFCFC">
      <div class="row" style="justify-content:space-between"><div><b>Estrella N.º ${r.numero}</b> · ${esc(r.equipo)} ${r.primero ? `<span class="tag val">Primero en hallarla</span>` : ""}</div>
      <span class="tag ${r.estado === "pendiente" ? "pend" : r.estado === "validado" ? "val" : "rec"}">${r.estado}${r.estado === "validado" ? " · " + puntos(r) + " pts" : ""}</span></div>
      <p class="muted" style="margin:4px 0">${fmt(r.ts)} · ${esc(r.integrantes)}</p>
      <div class="grid2"><div><h3>Lo que reportó el equipo</h3><p><b>Condición:</b> ${esc(r.condicion)}</p><p><b>Acción:</b> ${esc(r.accion)}</p>${r.foto ? `<img class="foto" src="${r.foto}" alt="Foto enviada por el equipo">` : ""}</div>
      <div><h3>Respuesta esperada</h3><div class="esperado"><p><b>Condición:</b> ${esc(e.condicion || "Sin registrar")}</p><p><b>Acción:</b> ${esc(e.accionEsperada || "Sin registrar")}</p></div>
      ${r.estado === "pendiente" ? `
        <label>¿Identificó la condición?</label><div class="punt" data-g="c-${r.id}"><button data-v="0" aria-pressed="false">No (0)</button><button data-v="10" aria-pressed="false">Sí (+10)</button></div>
        <label>¿La acción propuesta es correcta?</label><div class="punt" data-g="a-${r.id}"><button data-v="0" aria-pressed="false">No (0)</button><button data-v="5" aria-pressed="false">Parcial (+5)</button><button data-v="10" aria-pressed="false">Completa (+10)</button></div>
        <div class="row" style="margin-top:12px"><button class="btn ok sm" data-ok="${r.id}">Validar</button><button class="btn no sm" data-no="${r.id}">Rechazar</button></div>` : `<p class="muted">Condición +${r.pCond || 0} · Acción +${r.pAcc || 0}</p>`}
      </div></div></div>`;
  }).join("")}</section>`;
  const sel = {};
  pane.querySelectorAll(".punt").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => { g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); sel[g.dataset.g] = +b.dataset.v; }));
  pane.querySelectorAll("[data-ok]").forEach(b => b.onclick = async () => {
    const id = b.dataset.ok; if (sel["c-" + id] === undefined || sel["a-" + id] === undefined) return alert("Califica la condición y la acción antes de validar.");
    await DB.update("registros", id, { estado: "validado", pCond: sel["c-" + id], pAcc: sel["a-" + id], validadoTs: Date.now() }); hseq("validar");
  });
  pane.querySelectorAll("[data-no]").forEach(b => b.onclick = async () => { if (!confirm("¿Rechazar este hallazgo? No suma puntos.")) return; await DB.update("registros", b.dataset.no, { estado: "rechazado", validadoTs: Date.now() }); hseq("validar"); });
}

function agregarEquipos(regs) {
  const m = {};
  for (const r of regs) {
    const k = r.centroId + "|" + r.equipo;
    m[k] = m[k] || { centroId: r.centroId, equipo: r.equipo, pts: 0, estrellas: 0, ult: 0 };
    if (r.estado === "validado") { m[k].pts += puntos(r); m[k].estrellas++; m[k].ult = Math.max(m[k].ult, r.ts); }
  }
  return Object.values(m).filter(x => x.estrellas > 0).sort((a, b) => b.pts - a.pts || a.ult - b.ult);
}
async function paneRankCentro(pane, c) {
  const rk = agregarEquipos(await DB.where("registros", "centroId", c.id));
  pane.innerHTML = `<section class="card"><h2>Ranking del centro</h2>${tablaRank(rk, {}, false)}</section>`;
}
function tablaRank(rk, centros, conCentro) {
  if (!rk.length) return `<p class="muted">Aún no hay hallazgos validados.</p>`;
  return `<table><thead><tr><th>#</th><th>Equipo</th>${conCentro ? "<th>Centro</th>" : ""}<th>Estrellas</th><th>Puntos</th></tr></thead><tbody>${rk.map((x, i) => `<tr><td><b>${i + 1}</b></td><td>${esc(x.equipo)}</td>${conCentro ? `<td>${esc(centros[x.centroId]?.nombre || "")}</td>` : ""}<td>${x.estrellas}</td><td><b>${x.pts}</b></td></tr>`).join("")}</tbody></table>`;
}

/* ---------- Ranking público ---------- */
async function ranking() {
  const [regs, cs] = await Promise.all([DB.all("registros"), DB.all("centros")]);
  const centros = Object.fromEntries(cs.map(c => [c.id, c]));
  const rk = agregarEquipos(regs);
  view(`<section class="card hero"><div class="star">★</div><h1>Ranking nacional</h1><p>Solo cuentan los hallazgos validados por el HSEQ de cada centro.</p></section>
  ${rk.length ? `<div class="podio" style="margin-bottom:16px">${rk.slice(0, 3).map((x, i) => `<div><span>${["🥇", "🥈", "🥉"][i]}</span><b>${x.pts} pts</b>${esc(x.equipo)}<br><small class="muted">${esc(centros[x.centroId]?.nombre || "")}</small></div>`).join("")}</div>` : ""}
  <section class="card">${tablaRank(rk, centros, true)}</section><button class="btn sec" id="vol">Volver</button>`);
  $("#vol").onclick = inicio;
}

/* ---------- Administración nacional ---------- */
async function admin(tab = "resumen") {
  view(`<section class="card"><div class="row" style="justify-content:space-between"><div><h1>Administración nacional</h1><p class="muted" style="margin:0">¡Siga la estrella! · todos los centros</p></div><button class="btn sec sm" id="salir">Salir</button></div></section>
  <div class="tabs" role="group" aria-label="Secciones">
    <button data-t="resumen" aria-pressed="${tab === "resumen"}">Resumen</button>
    <button data-t="centros" aria-pressed="${tab === "centros"}">Centros</button>
    <button data-t="actividad" aria-pressed="${tab === "actividad"}">Fechas y apertura</button>
  </div><div id="pane"></div>`);
  $("#salir").onclick = () => { S.rol = null; inicio(); };
  app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => admin(b.dataset.t));
  const pane = $("#pane");
  if (tab === "centros") return admCentros(pane);
  if (tab === "actividad") return admActividad(pane);
  return admResumen(pane);
}
async function admResumen(pane) {
  const [regs, cs, est] = await Promise.all([DB.all("registros"), DB.all("centros"), DB.all("estrellas")]);
  const centros = Object.fromEntries(cs.map(c => [c.id, c]));
  const filas = cs.sort((a, b) => a.nombre.localeCompare(b.nombre)).map(c => {
    const r = regs.filter(x => x.centroId === c.id), e = est.filter(x => x.centroId === c.id);
    const cfgE = e.filter(x => x.condicion && x.ubicacion).length;
    const halladas = new Set(r.filter(x => x.estado === "validado").map(x => x.estrella)).size;
    return { c, equipos: (c.equipos || []).length, cfgE, reg: r.length, pend: r.filter(x => x.estado === "pendiente").length, halladas, pts: r.reduce((s, x) => s + puntos(x), 0) };
  });
  const rk = agregarEquipos(regs);
  pane.innerHTML = `<div class="grid2" style="margin-bottom:16px">
    <div class="card"><div class="big">${cs.length}</div>centros inscritos</div>
    <div class="card"><div class="big">${regs.length}</div>hallazgos registrados</div>
    <div class="card"><div class="big">${regs.filter(x => x.estado === "pendiente").length}</div>pendientes por validar</div>
  </div>
  <section class="card"><h2>Estado por centro</h2>
  <table><thead><tr><th>Centro</th><th>Equipos</th><th>Estrellas configuradas</th><th>Hallazgos</th><th>Pendientes</th><th>Estrellas halladas</th><th>Puntos</th></tr></thead><tbody>
  ${filas.map(f => `<tr><td>${esc(f.c.nombre)}<br><small class="muted">${esc(f.c.region || "")}</small></td><td>${f.equipos}</td><td>${f.cfgE}/10</td><td>${f.reg}</td><td>${f.pend ? `<span class="tag pend">${f.pend}</span>` : "0"}</td><td>${f.halladas}/10</td><td><b>${f.pts}</b></td></tr>`).join("") || `<tr><td colspan="7" class="muted">Crea los centros en la pestaña Centros.</td></tr>`}
  </tbody></table></section>
  <section class="card"><h2>Ranking nacional de equipos</h2>${tablaRank(rk, centros, true)}
  <div class="row" style="margin-top:12px"><button class="btn oro" id="csv">Descargar registros (CSV)</button></div></section>`;
  $("#csv").onclick = () => {
    const head = ["Centro", "Región", "Estrella", "Equipo", "Integrantes", "Condición reportada", "Acción propuesta", "Fecha", "Estado", "Primero", "Pts condición", "Pts acción", "Puntos totales"];
    const rows = regs.sort((a, b) => a.ts - b.ts).map(r => [centros[r.centroId]?.nombre, centros[r.centroId]?.region, r.numero, r.equipo, r.integrantes, r.condicion, r.accion, new Date(r.ts).toLocaleString("es-CO"), r.estado, r.primero ? "Sí" : "No", r.pCond || 0, r.pAcc || 0, puntos(r)]);
    const csv = "﻿" + [head, ...rows].map(x => x.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = "siga-la-estrella-registros.csv"; a.click();
  };
}
async function admCentros(pane) {
  const cs = (await DB.all("centros")).sort((a, b) => a.nombre.localeCompare(b.nombre));
  pane.innerHTML = `<section class="card"><h2>Centros de trabajo</h2>
  <div class="grid2"><div><label for="n">Nombre del centro</label><input id="n" placeholder="Ej.: Parquiamérica"></div>
  <div><label for="r">Región</label><select id="r"><option>Caribe</option><option>Suroccidente</option><option>Centro</option><option>Antioquia</option></select></div>
  <div><label for="pc">PIN del HSEQ del centro (mín. 4 dígitos)</label><input id="pc" inputmode="numeric"></div></div>
  <div id="m"></div><div class="row" style="margin-top:12px"><button class="btn pri" id="add">Agregar centro</button></div>
  <h3>Inscritos (${cs.length})</h3>
  <table><thead><tr><th>Centro</th><th>Región</th><th>Equipos</th><th></th></tr></thead><tbody>
  ${cs.map(c => `<tr><td>${esc(c.nombre)}</td><td>${esc(c.region || "")}</td><td>${(c.equipos || []).length}</td><td class="row"><button class="btn sec sm" data-pin="${esc(c.id)}">Cambiar PIN</button><button class="btn no sm" data-del="${esc(c.id)}">Eliminar</button></td></tr>`).join("") || `<tr><td colspan="4" class="muted">Sin centros todavía.</td></tr>`}
  </tbody></table></section>`;
  $("#add").onclick = async () => {
    const n = $("#n").value.trim(), p = $("#pc").value.trim();
    if (!n) return msg($("#m"), "Escribe el nombre del centro.");
    if (p.length < 4) return msg($("#m"), "El PIN debe tener al menos 4 dígitos.");
    if (cs.some(c => c.nombre.toLowerCase() === n.toLowerCase())) return msg($("#m"), "Ese centro ya existe.");
    await DB.set("centros", token(8), { nombre: n, region: $("#r").value, pin: await sha(p), equipos: [] }); admin("centros");
  };
  pane.querySelectorAll("[data-pin]").forEach(b => b.onclick = async () => { const p = prompt("Nuevo PIN para el HSEQ del centro (mín. 4 dígitos):"); if (!p || p.trim().length < 4) return; await DB.update("centros", b.dataset.pin, { pin: await sha(p.trim()) }); alert("PIN actualizado."); });
  pane.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if (!confirm("¿Eliminar el centro? Sus estrellas y hallazgos quedarán sin centro.")) return; await DB.del("centros", b.dataset.del); admin("centros"); });
}
async function admActividad(pane) {
  const cfg = await config();
  pane.innerHTML = `<section class="card"><h2>Fechas y apertura</h2>
  <p class="muted">La app solo acepta hallazgos cuando está abierta y dentro de las fechas.</p>
  <div class="grid2"><div><label for="i">Inicio</label><input id="i" type="datetime-local" value="${esc(cfg.inicio || "")}"></div>
  <div><label for="f">Cierre</label><input id="f" type="datetime-local" value="${esc(cfg.fin || "")}"></div></div>
  <label><input type="checkbox" id="ab" style="width:auto" ${cfg.abierta ? "checked" : ""}> Búsqueda abierta</label>
  <div id="m"></div><div class="row" style="margin-top:12px"><button class="btn pri" id="g">Guardar</button></div></section>`;
  $("#g").onclick = async () => { await DB.update("config", "app", { inicio: $("#i").value, fin: $("#f").value, abierta: $("#ab").checked }); msg($("#m"), "Guardado.", "okb"); };
}

/* ---------- Arranque ---------- */
$("#lnkInicio").onclick = (e) => { e.preventDefault(); history.replaceState(null, "", location.pathname); S.rol = null; inicio(); };
const tk = new URLSearchParams(location.search).get("s");
try { tk ? await estrella(tk) : await inicio(); }
catch (err) { console.error(err); view(`<div class="banner err">No se pudo conectar con la base de datos. Revisa tu conexión o la configuración de Firebase.</div>`); }
</script>
