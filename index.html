async function panel(p) {
  const [ints, fotos] = await Promise.all([DB.where("intentos", "pid", p.id), DB.where("fotos", "pid", p.id)]);
  const I = Object.fromEntries(ints.map(x => [x.mision, x])), F = Object.fromEntries(fotos.map(x => [x.actividad, x]));
  const c = CENTROS[p.centroId];
  const item = (a, tipo) => {
    const ab = abierta(a), it = tipo === "m" ? I[a.id] : F[a.id];
    let est, cls = "", btn = "";
    if (tipo === "m") {
      if (it?.estado === "terminado") { est = `<span class="tag val">${it.estrellas} de ${maxMision(a)} ⭐</span>`; cls = "hecha"; }
      else if (it) { est = `<span class="tag pend">En curso</span>`; btn = `<button class="btn pri sm" data-m="${a.id}">Continuar</button>`; cls = "abierta"; }
      else if (ab) { est = `<span class="tag pend">Hasta ${maxMision(a)} ⭐</span>`; btn = `<button class="btn pri sm" data-m="${a.id}">Jugar</button>`; cls = "abierta"; }
      else est = terminada() ? `<span class="tag lock">Cerrada</span>` : `<span class="tag lock">Abre ${fmtF(a.abre)}</span>`;
    } else {
      if (it?.estado === "aprobada") { est = `<span class="tag val">Aprobada · ${it.estrellas || a.estrellas} ⭐</span>`; cls = "hecha"; }
      else if (it?.estado === "pendiente") est = `<span class="tag pend">En revisión del HSEQ</span>`;
      else if (it?.estado === "rechazada" && ab) { est = `<span class="tag rec">Rechazada: ${esc(it.motivo || "")}</span>`; btn = `<button class="btn pri sm" data-f="${a.id}">${a.tipo === "texto" ? "Escribir otro" : "Subir otra"}</button>`; cls = "abierta"; }
      else if (ab) { est = `<span class="tag pend">${a.tipo === "red" ? "hasta " + maxAct(a) : a.estrellas} ⭐ al aprobarse</span>`; btn = `<button class="btn pri sm" data-f="${a.id}">${a.tipo === "texto" ? "Escribir" : a.tipo === "red" ? "Subir captura" : "Subir foto"}</button>`; cls = "abierta"; }
      else est = ahora() < Date.parse(a.abre) && !CFG.pruebas ? `<span class="tag lock">Abre ${fmtF(a.abre)}</span>` : `<span class="tag lock">Cerrada</span>`;
    }
    return `<div class="mision ${cls}"><div class="ico" aria-hidden="true">${a.ico}</div><div class="info"><b>${esc(a.titulo)}</b><small>${tipo === "m" ? esc(a.tema) : a.tipo === "texto" ? "Escríbelo en la app · lo revisa HSEQ" : a.tipo === "red" ? "Publica en redes y etiqueta a ANAVA" : "Actividad con foto"}</small><div>${est}</div></div>${btn}</div>`;
  };
  view(`
  <section class="card hero">${tito(p.estrellas > 0 ? "encontrada" : "inicio", "Tito te acompaña")}
    <p style="margin:0">Hola, <b>${esc(corto(p.nombre))}</b> · ${esc(c?.nombre || "")}</p>
    <div class="estrellas" style="margin:8px 0">${p.estrellas || 0} ⭐</div>
    <p style="margin:0">estrellas acumuladas</p>
  </section>
  ${terminada() ? `<div class="banner okb">La campaña terminó. ¡Gracias por participar! Mira los ganadores en el ranking.</div>` : ""}
  <section class="card"><h2>Tus misiones</h2>
  ${FASES.map(f => `<div class="fase">${f}</div>${MISIONES.filter(m => m.fase === f).map(m => item(m, "m")).join("")}${FOTOS.filter(x => x.fase === f).map(x => item(x, "f")).join("")}`).join("")}
  <p class="muted" style="font-size:13px">Cada misión tiene ${PREG} preguntas. Tienes ${SEG} segundos para cada una y una sola oportunidad. Ganas 1 estrella por cada respuesta buena y 1 más si las aciertas todas. La gran final da el doble.</p>
  </section>
  ${finalAbierta() && !LS.get("sle-final-" + p.id) ? `<section class="card" style="border:2px solid var(--oro)"><h2>📝 Encuesta de cierre</h2><p style="margin-top:0">¿Cómo te pareció la campaña? Son 3 preguntas y te toma 1 minuto.</p><button class="btn pri" id="bFin">Responder encuesta</button></section>` : ""}
  <section class="card"><h2>💬 Tu opinión cuenta</h2><p style="margin-top:0">Sugerencias, mejoras, quejas o felicitaciones sobre la campaña. Puedes enviarla sin tu nombre.</p><button class="btn sec" id="bOp">Dar mi opinión</button></section>
  <div class="row"><button class="btn sec" id="bRank">Ver ranking</button><button class="btn sec" id="salir">No soy ${esc(corto(p.nombre))}</button></div>`);
  $("#bOp").onclick = () => opinarGeneral(p);
  if ($("#bFin")) $("#bFin").onclick = () => encuestaFinal(p);

  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => subirFoto(p, FOTOS.find(x => x.id === b.dataset.f)));

const caras = (id) => `<div class="caras" id="${id}" role="group">${CARAS.map((c, i) => `<button type="button" data-v="${i + 1}" aria-pressed="false" aria-label="${i + 1} de 5">${c}</button>`).join("")}</div><div class="row muted" style="justify-content:space-between;font-size:12px"><span>Nada</span><span>Mucho</span></div>`;
function activarCaras(id) { const g = $("#" + id); g.querySelectorAll("button").forEach(b => b.onclick = () => { g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); g.dataset.v = b.dataset.v; }); }
const valorCaras = (id) => +($("#" + id).dataset.v || 0) || null;
const conNombre = () => `<label class="check"><input type="checkbox" id="cn"> Enviar con mi nombre (si no lo marcas, tu opinión llega sin nombre)</label>`;

}

async function encuestaFinal(p) {

/* ---------- Trivia ---------- */
function bancoDe(m) {
  if (m.id !== "m8") return (window.BANCO[m.id] || []).map((q, i) => ({ k: m.id + ":" + i, q }));
  return Object.keys(window.BANCO).flatMap(id => window.BANCO[id].map((q, i) => ({ k: id + ":" + i, q })));
}
const pregDe = (k) => { const [id, i] = k.split(":"); return window.BANCO[id][+i]; };
function mezclar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

async function trivia(p, m) {
  if (!abierta(m)) return panel(p);
  const iid = p.id + "_" + m.id;
  let it = await DB.get("intentos", iid);
  if (it?.estado === "terminado") return panel(p);
  if (!it) {
    view(`<section class="card hero"><div style="font-size:54px" aria-hidden="true">${m.ico}</div><h1>${esc(m.titulo)}</h1><p>${esc(m.tema)}</p></section>
    <section class="card"><ul><li><b>${PREG} preguntas</b>, ${SEG} segundos cada una.</li><li><b>Una sola oportunidad.</b> Si se cierra la app, sigues donde ibas.</li><li>Hasta <b>${maxMision(m)} estrellas</b>${m.doble ? " (esta misión vale doble)" : ""}.</li></ul>
    <div class="row"><button class="btn pri" id="go">Empezar</button><button class="btn sec" id="vol">Volver</button></div></section>`);
    $("#vol").onclick = () => panel(p);
    $("#go").onclick = async () => {
      $("#go").disabled = true;
      const qs = mezclar(bancoDe(m)).slice(0, PREG).map(x => x.k);
      const ords = qs.map(() => mezclar([0, 1, 2, 3]));
      it = { pid: p.id, centroId: p.centroId, mision: m.id, qs, ords: ords.map(o => o.join("")), idx: 0, correctas: 0, segundos: 0, estado: "en curso", inicio: ahora() };
      await DB.set("intentos", iid, it); pregunta(p, m, iid, it);
    };
    return;
  }
  pregunta(p, m, iid, it);
}

function pregunta(p, m, iid, it) {
  if (it.idx >= it.qs.length) return terminar(p, m, iid, it);
  const [q, ops, ok, exp] = pregDe(it.qs[it.idx]);
  const ord = String(it.ords[it.idx]).split("").map(Number);
  let resto = SEG, listo = false; const t0 = ahora();
  view(`<section class="card">
    <div class="row" style="justify-content:space-between"><b>${esc(m.titulo)} · Pregunta ${it.idx + 1} de ${it.qs.length}</b><span class="reloj" id="rel" aria-live="off">${SEG}s</span></div>
    <div class="barra" style="margin:10px 0"><div style="width:${(it.idx / it.qs.length) * 100}%"></div></div>
    <h2 style="margin-top:14px">${esc(q)}</h2>
    <div id="ops">${ord.map(i => `<button class="opc" data-i="${i}">${esc(ops[i])}</button>`).join("")}</div>
    <div id="fb"></div></section>`);
  const tick = setInterval(() => { resto--; const r = $("#rel"); if (!r) return clearInterval(tick); r.textContent = resto + "s"; if (resto <= 10) r.classList.add("bajo"); if (resto <= 0) responder(-1); }, 1000);
  async function responder(i) {
    if (listo) return; listo = true; clearInterval(tick);
    const bien = i === ok, seg = Math.min(SEG, Math.round((ahora() - t0) / 1000));
    app.querySelectorAll(".opc").forEach(b => { b.disabled = true; if (+b.dataset.i === ok) b.classList.add("bien"); else if (+b.dataset.i === i) b.classList.add("mal"); });
    it.idx++; it.correctas += bien ? 1 : 0; it.segundos += i === -1 ? SEG : seg;
    await DB.update("intentos", iid, { idx: it.idx, correctas: it.correctas, segundos: it.segundos });
    $("#fb").innerHTML = `<div class="banner ${bien ? "okb" : "err"}" style="margin-top:12px">${i === -1 ? "Se acabó el tiempo. " : bien ? "¡Correcto! " : "No es correcta. "}${esc(exp)}</div><button class="btn pri full" id="sig">${it.idx >= it.qs.length ? "Ver resultado" : "Siguiente pregunta"}</button>`;
    $("#sig").onclick = () => pregunta(p, m, iid, it);
  }
  app.querySelectorAll(".opc").forEach(b => b.onclick = () => responder(+b.dataset.i));
}

async function terminar(p, m, iid, it) {
  if (it.estado !== "terminado") {
    const mult = m.doble ? 2 : 1;
    const est = (it.correctas + (it.correctas === it.qs.length ? 1 : 0)) * mult;
    it.estado = "terminado"; it.estrellas = est;
    await DB.update("intentos", iid, { estado: "terminado", estrellas: est, fin: ahora() });
    await DB.inc("participantes", p.id, { estrellas: est, segundos: it.segundos });
    await DB.update("participantes", p.id, { ultimo: ahora() });
  }
  const pp = await DB.get("participantes", p.id);
  view(`<section class="card hero">${tito(it.estrellas > 0 ? "enviado" : "alto", "Tito")}
    <h1>${it.correctas === it.qs.length ? "¡Misión perfecta!" : "¡Misión completada!"}</h1>
    <p>${it.correctas} de ${it.qs.length} respuestas correctas</p>
    <div class="estrellas">+${it.estrellas} ⭐</div><p>Ahora tienes <b>${pp.estrellas} estrellas</b></p></section>
    ${LS.get("sle-op-" + iid) ? "" : `<section class="card opina" id="opM"><h2>¿Qué te pareció esta misión?</h2>${caras("cm")}
    <label for="cx">¿Algo que mejorar? (opcional)</label><textarea id="cx" rows="2" maxlength="300" placeholder="Ej.: una pregunta no se entendía"></textarea>
    ${conNombre()}<div id="m"></div><div class="row" style="margin-top:10px"><button class="btn sec" id="envM">Enviar opinión</button></div></section>`}
    <button class="btn pri full" id="vol">Volver a mis misiones</button>`);
  $("#vol").onclick = () => panel(pp);
  if ($("#envM")) {
    activarCaras("cm");
    $("#envM").onclick = async () => {
      const c = valorCaras("cm"), t = $("#cx").value.trim();
      if (!c && !t) return msg($("#m"), "Toca una carita o escribe un comentario.");
      $("#envM").disabled = true;
      try { await guardarOpinion(pp, "mision:" + m.id, { calif: c, texto: t }, true); } catch {}
      LS.set("sle-op-" + iid, "1");
      $("#opM").innerHTML = `<p style="margin:0;font-weight:700;color:var(--ok)">¡Gracias! Tu opinión nos ayuda a mejorar.</p>`;
    };
  }
}

/* ---------- Foto ---------- */
async function subirFoto(p, a) {

  if (a.tipo === "red") return subirRed(p, a);
  view(`<section class="card hero"><div style="font-size:54px" aria-hidden="true">${a.ico}</div><h1>${esc(a.titulo)}</h1><p>${a.estrellas} estrellas cuando el HSEQ de tu centro apruebe la foto</p></section>
  <section class="card"><p>${esc(a.instr)}</p>${a.privada ? `<p class="muted" style="font-size:13px">Esta foto solo la ven el HSEQ de tu centro y la administración. No se publica.</p>` : ""}
  <label for="fo">Foto</label><input id="fo" type="file" accept="image/*" capture="environment">
  <img id="pre" class="foto hidden" alt="Vista previa">
  <div id="m"></div>
  <div class="row" style="margin-top:12px"><button class="btn pri" id="env" disabled>Enviar foto</button><button class="btn sec" id="vol">Volver</button></div></section>`);
  let foto = null;
  $("#vol").onclick = () => panel(p);
  $("#fo").onchange = async (e) => { const f = e.target.files[0]; if (!f) return; foto = await comprimir(f); if (!foto) return msg($("#m"), "No se pudo leer la imagen. Intenta con otra."); $("#pre").src = foto; $("#pre").classList.remove("hidden"); $("#env").disabled = false; };
  $("#env").onclick = async () => {
    $("#env").disabled = true;
    try {
      await DB.set("fotos", p.id + "_" + a.id, { pid: p.id, nombre: p.nombre, centroId: p.centroId, actividad: a.id, foto, estado: "pendiente", motivo: "", ts: ahora() });
      view(`<section class="card hero">${tito("enviado", "Tito con el pulgar arriba")}<h1>¡Foto enviada!</h1><p>El HSEQ de tu centro la revisará. Cuando la apruebe, sumarás ${a.estrellas} estrellas.</p></section><button class="btn pri full" id="vol">Volver a mis misiones</button>`);
      $("#vol").onclick = async () => panel(await DB.get("participantes", p.id));
    } catch { $("#env").disabled = false; msg($("#m"), "No se pudo enviar. Revisa tu conexión e intenta otra vez."); }
  };
}

async function subirRed(p, a) {

  app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => hseq(b.dataset.t));

    <div class="row" style="justify-content:space-between"><b>${esc(a.titulo)}</b><span class="tag ${f.estado === "pendiente" ? "pend" : f.estado === "aprobada" ? "val" : "rec"}">${f.estado}</span></div>

    <p style="font-size:13px" class="muted">Criterio: ${esc(a.instr)}</p>
    ${f.foto ? `<img class="foto" src="${f.foto}" alt="Foto enviada por ${esc(f.nombre)}">` : ""}${f.texto ? `<blockquote style="margin:8px 0;padding:10px 12px;background:#fff;border-left:4px solid var(--rojo);border-radius:6px">«${esc(f.texto)}»</blockquote>` : ""}
    ${a.tipo === "red" ? `<p style="font-size:13px;margin:4px 0"><b>Revisa en la captura:</b> etiqueta a ANAVA (${esc(RED.cuentas)}) y los hashtags ${esc(RED.hashtags)}. Declaró <b>${f.etiquetas || 0}</b> personas etiquetadas.</p>
      ${f.estado === "pendiente" ? `<label for="ce-${esc(f.id)}">Personas etiquetadas que ves en la captura</label><select id="ce-${esc(f.id)}" data-ce="${esc(f.id)}">${[0, 1, 2, 3, 4, 5].map(n => `<option value="${n}" ${n === Math.min(5, f.etiquetas || 0) ? "selected" : ""}>${n}${n === 5 ? " o más" : ""}</option>`).join("")}</select>` : `<p style="font-size:13px">Etiquetas validadas: ${f.etiquetas ?? 0} · ${f.estrellas ?? ""} ⭐</p>`}` : ""}
    ${f.estado === "pendiente" ? `<div class="row"><button class="btn ok sm" data-ok="${esc(f.id)}">Aprobar (+<span id="se-${esc(f.id)}">${a.tipo === "red" ? estrellasRed(f.etiquetas) : a.estrellas}</span> ⭐)</button><button class="btn no sm" data-no="${esc(f.id)}">Rechazar</button></div><div id="r-${esc(f.id)}"></div>` : f.motivo ? `<p>Motivo: ${esc(f.motivo)}</p>` : ""}
  </div>`; }).join("") : `${tito("hseq", "Tito", "sm")}<p class="muted" style="text-align:center">${tab === "fotos" ? "No hay nada pendiente por revisar." : "Aún no has revisado nada."}</p>`}</section>`;

function csv(nombre, head, rows) {
  const t = "﻿" + [head, ...rows].map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/csv;charset=utf-8" })); a.download = nombre; a.click();
}
function ganadores(ps) {
  const v = ps.filter(valido).filter(x => x.estrellas > 0).sort(ordenRank);
  const nacional = v[0] || null;
  const porCentro = Object.values(CENTROS).filter(c => !c.prueba).map(c => ({ c, g: v.find(x => x.centroId === c.id && x.id !== nacional?.id) || null }));
  return { nacional, porCentro };
}
function admGanadores(pane, ps) {

async function admCentros(pane) {
  const cs = Object.values(CENTROS).sort((a, b) => a.nombre.localeCompare(b.nombre));
  pane.innerHTML = `<section class="card"><h2>Centros de trabajo</h2>
  <div class="grid2"><div><label for="n">Nombre del centro</label><input id="n" placeholder="Ej.: Parquiamérica"></div>
  <div><label for="r">Región</label><select id="r"><option>Caribe</option><option>Suroccidente</option><option>Centro</option><option>Antioquia</option></select></div>
  <div><label for="pc">PIN del HSEQ del centro (mín. 4 dígitos)</label><input id="pc" inputmode="numeric"></div></div>
  <label class="check"><input type="checkbox" id="pr"> Centro de prueba (no cuenta para ranking ni ganadores)</label>
  <div id="m"></div><div class="row" style="margin-top:12px"><button class="btn pri" id="add">Agregar centro</button></div>
  <h3>Cargar varios centros a la vez</h3>
  <p class="muted" style="font-size:13px">Una línea por centro: <b>Nombre del centro; Región</b>. Regiones: Caribe, Suroccidente, Centro o Antioquia. Puedes pegar dos columnas copiadas de Excel. La app crea un PIN de 6 dígitos para cada centro nuevo; los centros que ya existen se omiten.</p>
  <textarea id="lote" rows="6" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc" placeholder="Parquiamérica; Caribe&#10;PMI Cali; Suroccidente"></textarea>
  <div id="ml"></div><div class="row" style="margin-top:10px"><button class="btn pri" id="crearLote">Crear centros y generar PIN</button></div><div id="pines"></div>
  <h3>¿Perdiste los PIN?</h3>
  <p class="muted" style="font-size:13px">Genera un PIN nuevo para todos los centros reales (no cambia el centro de prueba). Los PIN anteriores dejan de funcionar.</p>
  <div class="row"><button class="btn sec" id="regen">Generar PIN nuevo para todos</button></div><div id="mr"></div>
  <h3>Inscritos (${cs.length})</h3><table><thead><tr><th>Centro</th><th>Región</th><th></th></tr></thead><tbody>
  ${cs.map(c => `<tr><td>${esc(c.nombre)}${c.prueba ? ` <span class="tag lock">prueba</span>` : ""}</td><td>${esc(c.region || "")}</td><td><div class="row"><button class="btn sec sm" data-pin="${esc(c.id)}">Cambiar PIN</button><button class="btn no sm" data-del="${esc(c.id)}">Eliminar</button></div><div id="x-${esc(c.id)}"></div></td></tr>`).join("") || `<tr><td colspan="3" class="muted">Sin centros todavía.</td></tr>`}
  </tbody></table></section>`;
  $("#add").onclick = async () => {
    const n = $("#n").value.trim(), p = $("#pc").value.trim();
    if (!n) return msg($("#m"), "Escribe el nombre del centro.");
    if (p.length < 4) return msg($("#m"), "El PIN debe tener al menos 4 dígitos.");
    if (cs.some(c => c.nombre.toLowerCase() === n.toLowerCase())) return msg($("#m"), "Ese centro ya existe.");
    await DB.set("centros", rid(8), { nombre: n, region: $("#r").value, pin: await sha(p), prueba: $("#pr").checked });
    await cargarBase(); admin("centros");
  };
  $("#regen").onclick = () => {
    $("#mr").innerHTML = `<div class="banner" style="margin-top:8px">¿Seguro? Los HSEQ tendrán que usar el PIN nuevo. <button class="btn no sm" id="regenSi">Sí, generar</button> <button class="btn sec sm" id="regenNo">Cancelar</button></div>`;
    $("#regenNo").onclick = () => { $("#mr").innerHTML = ""; };
    $("#regenSi").onclick = async () => {
      $("#regenSi").disabled = true;
      const reales = cs.filter(c => !c.prueba).sort((a, b) => (a.region || "").localeCompare(b.region || "") || a.nombre.localeCompare(b.nombre)), filas = [];
      for (const c of reales) { const n = new Uint32Array(1); crypto.getRandomValues(n); const pin = String(100000 + (n[0] % 900000)); await DB.update("centros", c.id, { pin: await sha(pin) }); filas.push([c.nombre, c.region || "", pin]); }
      await cargarBase(); $("#mr").innerHTML = ""; mostrarPines(filas, []);
    };
  };
  function mostrarPines(creados, omitidos) {
    $("#pines").innerHTML = `<div class="card" style="background:#FFF8E1;margin-top:10px"><b>Guarda estos PIN ahora.</b> Por seguridad la app no vuelve a mostrarlos; si se pierde uno, usa «Cambiar PIN».
      <table style="margin-top:8px"><thead><tr><th>Centro</th><th>Región</th><th>PIN</th></tr></thead><tbody>${creados.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td><b>${r[2]}</b></td></tr>`).join("")}</tbody></table>

    $("#dlp").onclick = () => csv("pines-hseq-centros.csv", ["Centro", "Región", "PIN"], creados);
    $("#cpp").onclick = async () => { try { await navigator.clipboard.writeText(["Centro\tRegión\tPIN", ...creados.map(r => r.join("\t"))].join("\n")); msg($("#mc"), "Tabla copiada: pégala en Excel o en tus notas.", "okb"); } catch { msg($("#mc"), "No se pudo copiar; usa Descargar."); } };
    $("#pines").scrollIntoView({ block: "start" });
  }
  $("#crearLote").onclick = async () => {
    const REG = { caribe: "Caribe", suroccidente: "Suroccidente", centro: "Centro", antioquia: "Antioquia" };
    const filas = $("#lote").value.split(/\r?\n/).map(l => l.split(/[;\t]/).map(x => x.trim())).filter(x => x[0]);
    if (!filas.length) return msg($("#ml"), "Pega al menos un centro.");
    const malos = filas.filter(f => !REG[(f[1] || "").toLowerCase()]);
    if (malos.length) return msg($("#ml"), "Revisa la región de: " + malos.map(f => f[0]).join(", ") + ". Usa Caribe, Suroccidente, Centro o Antioquia.");
    $("#crearLote").disabled = true;
    const existentes = new Set(cs.map(c => c.nombre.toLowerCase())), creados = [], omitidos = [];
    for (const [nom, reg] of filas) {
      if (existentes.has(nom.toLowerCase())) { omitidos.push(nom); continue; }
      const n = new Uint32Array(1); crypto.getRandomValues(n); const pin = String(100000 + (n[0] % 900000));
      await DB.set("centros", rid(8), { nombre: nom, region: REG[reg.toLowerCase()], pin: await sha(pin), prueba: false });
      existentes.add(nom.toLowerCase()); creados.push([nom, REG[reg.toLowerCase()], pin]);
    }
    await cargarBase(); await admin("centros");
    if (!creados.length) return msg($("#ml"), "No se creó ningún centro: ya existían todos.", "okb");
    mostrarPines(creados, omitidos);
    $("#dlp").click();
  };
  pane.querySelectorAll("[data-pin]").forEach(b => b.onclick = () => {
    const box = $("#x-" + CSS.escape(b.dataset.pin));

  });
  pane.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const box = $("#x-" + CSS.escape(b.dataset.del));
    box.innerHTML = `<div class="row" style="margin-top:6px"><span class="muted" style="font-size:13px">¿Eliminar? Sus participantes quedarán sin centro.</span><button class="btn no sm" id="cd">Sí, eliminar</button></div>`;
    $("#cd").onclick = async () => { await DB.del("centros", b.dataset.del); await cargarBase(); admin("centros"); };
  });
}
async function admRanking(pane, f = { reg: "", n: 50 }, cache) {

    const pc = ps.filter(p => p.centroId === c.id), est = pc.reduce((s, p) => s + (p.estrellas || 0), 0);
    return { c, n: pc.length, est, prom: pc.length ? est / pc.length : 0, mis: fin.filter(x => x.centroId === c.id).length, lider: pc[0] };
  }).sort((a, b) => b.prom - a.prom || b.n - a.n || a.c.nombre.localeCompare(b.c.nombre));

    <div class="card"><div class="estrellas" style="color:var(--rojo)">${centros.filter(x => x.n).length} / ${centros.length}</div>centros participando</div>
    <div class="card"><div class="estrellas" style="color:var(--rojo)">${ps.reduce((s, p) => s + (p.estrellas || 0), 0)}</div>estrellas en total</div></div>
  <section class="card"><div class="row" style="justify-content:space-between;align-items:flex-end"><h2 style="margin:0">Ranking por centro de trabajo</h2>
  <div><label for="fr">Región</label><select id="fr"><option value="">Nacional</option>${regs.map(r => `<option ${f.reg === r ? "selected" : ""}>${esc(r)}</option>`).join("")}</select></div></div>
  <p class="muted" style="font-size:13px">Ordenado por promedio de estrellas por participante, para comparar centros grandes y pequeños.</p>
  <table><thead><tr><th>#</th><th>Centro</th><th>Participantes</th><th>Estrellas</th><th>Promedio</th><th>Misiones</th><th>Líder</th></tr></thead><tbody>
  ${centros.map((x, i) => `<tr><td>${x.n ? medalla(i) : "—"}</td><td><b>${esc(x.c.nombre)}</b><br><small class="muted">${esc(x.c.region || "")}</small></td><td>${x.n}</td><td>${x.est}</td>
    <td style="min-width:120px"><b>${x.prom.toFixed(1)}</b><div style="height:8px;border-radius:4px;background:#EEE;margin-top:4px"><div style="height:8px;border-radius:4px;background:var(--oro);width:${Math.round(x.prom / maxProm * 100)}%"></div></div></td>
    <td>${x.mis}</td><td>${x.lider ? esc(corto(x.lider.nombre)) + ` <small class="muted">(${x.lider.estrellas})</small>` : `<span class="muted">Sin participantes</span>`}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">Sin centros.</td></tr>`}
  </tbody></table></section>
  <section class="card"><h2>Ranking ${f.reg ? "de " + esc(f.reg) : "nacional"} por persona</h2>
  <p class="muted" style="font-size:13px">Desempate: menos tiempo total en las misiones y, si sigue igual, quien terminó primero. <b>Toca un nombre</b> para ver sus misiones, fotos y compromisos.</p>
  <table><thead><tr><th>#</th><th>Nombre</th><th>Centro</th><th>Cédula</th><th>Estrellas</th><th>Tiempo</th></tr></thead><tbody>
  ${ps.slice(0, f.n).map((p, i) => `<tr><td>${medalla(i)}</td><td><button class="btn sec sm" data-per="${esc(p.id)}" style="text-align:left">${esc(p.nombre)}</button></td><td>${esc(CENTROS[p.centroId]?.nombre || "")}</td><td>…${esc(p.cedula4)}</td><td><b>${p.estrellas || 0}</b></td><td>${Math.floor((p.segundos || 0) / 60)}:${String(Math.round(p.segundos || 0) % 60).padStart(2, "0")} min</td></tr>`).join("") || `<tr><td colspan="6" class="muted">Aún no hay participantes.</td></tr>`}

}

async function admEnvios(pane, f = { estado: "pendiente", act: "", centro: "", n: 30 }, cache) {

  const enVista = (cid) => !CENTROS[cid]?.prueba || verPrueba();

    <div class="card"><div class="estrellas" style="color:var(--ok)">${cuenta("aprobada")}</div>aprobados</div>
    <div class="card"><div class="estrellas" style="color:var(--rojo)">${cuenta("rechazada")}</div>rechazados</div></div>
  <section class="card"><h2>Fotos y compromisos (${lista.length})</h2>
  <p class="muted" style="font-size:13px;margin-top:0">Solo consulta: la aprobación la hace el HSEQ de cada centro. El mensaje de la familia es privado: no lo descargues ni lo compartas.</p>
  <div class="grid2"><div><label for="fe">Estado</label><select id="fe"><option value="">Todos</option>${Object.entries(EST).map(([k, v]) => `<option value="${k}" ${f.estado === k ? "selected" : ""}>${v[0]}</option>`).join("")}</select></div>

  ${lista.slice(0, f.n).map(x => { const a = FOTOS.find(y => y.id === x.actividad); const e = EST[x.estado] || [x.estado, "lock"]; return `<div class="card" style="background:#FCFCFC;margin:12px 0 0">
    <div class="row" style="justify-content:space-between"><b>${esc(a?.titulo || x.actividad)}</b><span class="tag ${e[1]}">${e[0]}</span></div>
    <small class="muted">${esc(x.nombre)} · ${esc(CENTROS[x.centroId]?.nombre || "Sin centro")} · enviado ${fecha(x.ts)}${x.revisado ? ` · revisado ${fecha(x.revisado)}` : ""}</small>
    ${x.foto ? `<img class="foto" loading="lazy" src="${x.foto}" alt="Foto enviada por ${esc(x.nombre)}">` : ""}${x.texto ? `<blockquote style="margin:8px 0;padding:10px 12px;background:#fff;border-left:4px solid var(--rojo);border-radius:6px">«${esc(x.texto)}»</blockquote>` : ""}
    ${x.etiquetas != null ? `<small>Personas etiquetadas: ${x.etiquetas}${x.estrellas ? ` · ${x.estrellas} ⭐ aprobadas` : ""}</small><br>` : ""}${x.estado === "rechazada" && x.motivo ? `<small><b>Motivo del rechazo:</b> ${esc(x.motivo)}</small>` : ""}</div>`; }).join("") || `<p class="muted">No hay envíos con estos filtros.</p>`}

  const prom = (xs) => xs.length ? (xs.reduce((s, x) => s + x, 0) / xs.length).toFixed(1) : "—";
  const gen = ops.filter(o => o.contexto === "general"), fin = ops.filter(o => o.contexto === "final");
  const porMision = MISIONES.map(m => { const xs = ops.filter(o => o.contexto === "mision:" + m.id); return { m, n: xs.length, p: prom(xs.map(o => o.calif).filter(Boolean)), c: xs.filter(o => o.texto).length }; });
  const ctxNom = (c) => c === "general" ? "Opinión libre" : c === "final" ? "Encuesta de cierre" : (MISIONES.find(m => "mision:" + m.id === c)?.titulo || c);
  const lista = ops.filter(o => (o.texto || o.gusto || o.mejora) && (!filtro.tipo || (filtro.tipo === "Misiones" ? o.contexto.startsWith("mision:") : filtro.tipo === "Encuesta" ? o.contexto === "final" : o.tipo === filtro.tipo)) && (!filtro.centro || o.centroId === filtro.centro));
  pane.innerHTML = `<div class="grid2" style="margin-bottom:12px">
    <div class="card"><div class="estrellas" style="color:var(--rojo)">${ops.length}</div>opiniones recibidas</div>
    <div class="card"><div class="estrellas" style="color:var(--rojo)">${fin.length}</div>encuestas de cierre</div></div>
  <section class="card"><h2>Opiniones libres por tipo</h2><table><thead><tr>${TIPOS_OP.map(t => `<th>${t}</th>`).join("")}</tr></thead><tbody><tr>${TIPOS_OP.map(t => `<td><b>${gen.filter(o => o.tipo === t).length}</b></td>`).join("")}</tr></tbody></table></section>
  <section class="card"><h2>Calificación de cada misión (1 a 5)</h2><table><thead><tr><th>Misión</th><th>Respuestas</th><th>Promedio</th><th>Comentarios</th></tr></thead><tbody>${porMision.map(x => `<tr><td>${esc(x.m.titulo)}</td><td>${x.n}</td><td><b>${x.p}</b></td><td>${x.c}</td></tr>`).join("")}</tbody></table></section>
  <section class="card"><h2>Encuesta de cierre (1 a 5)</h2><table><thead><tr><th>Pregunta</th><th>Promedio</th></tr></thead><tbody>${PREG_FINAL.map((q, i) => `<tr><td>${esc(q)}</td><td><b>${prom(fin.map(o => o["r" + (i + 1)]).filter(Boolean))}</b></td></tr>`).join("")}</tbody></table></section>
  <section class="card"><h2>Comentarios (${lista.length})</h2>
  <div class="grid2"><div><label for="ft">Tipo</label><select id="ft"><option value="">Todos</option>${[...TIPOS_OP, "Misiones", "Encuesta"].map(t => `<option ${filtro.tipo === t ? "selected" : ""}>${t}</option>`).join("")}</select></div>
  <div><label for="fc">Centro</label><select id="fc"><option value="">Todos</option>${Object.values(CENTROS).sort((a, b) => a.nombre.localeCompare(b.nombre)).map(c => `<option value="${esc(c.id)}" ${filtro.centro === c.id ? "selected" : ""}>${esc(c.nombre)}</option>`).join("")}</select></div></div>
  ${lista.slice(0, 200).map(o => `<div class="card" style="background:#FCFCFC;margin:10px 0 0"><div class="row" style="justify-content:space-between"><b>${esc(o.tipo || ctxNom(o.contexto))}</b><small class="muted">${esc(CENTROS[o.centroId]?.nombre || "")} · ${new Date(o.ts).toLocaleDateString("es-CO")}</small></div>
    ${o.tipo ? `<small class="muted">${esc(ctxNom(o.contexto))}</small>` : o.calif ? `<small>${CARAS[o.calif - 1]} ${o.calif}/5</small>` : ""}
    ${o.texto ? `<p style="margin:6px 0 0">${esc(o.texto)}</p>` : ""}${o.gusto ? `<p style="margin:6px 0 0"><b>Le gustó:</b> ${esc(o.gusto)}</p>` : ""}${o.mejora ? `<p style="margin:6px 0 0"><b>Mejoraría:</b> ${esc(o.mejora)}</p>` : ""}
    <small class="muted">${o.nombre ? esc(o.nombre) : "Sin nombre"}</small></div>`).join("") || `<p class="muted">Aún no hay comentarios.</p>`}
  <div class="row" style="margin-top:12px"><button class="btn oro" id="dlo">Descargar todas las opiniones (CSV)</button></div></section>`;
  $("#ft").onchange = () => admOpiniones(pane, { ...filtro, tipo: $("#ft").value });
  $("#fc").onchange = () => admOpiniones(pane, { ...filtro, centro: $("#fc").value });
  $("#dlo").onclick = () => csv("opiniones-siga-la-estrella.csv", ["Fecha", "Origen", "Tipo", "Centro", "Región", "Calificación misión", ...PREG_FINAL, "Comentario", "Lo que más le gustó", "Qué mejoraría", "Nombre"],
    ops.map(o => [new Date(o.ts).toLocaleString("es-CO"), ctxNom(o.contexto), o.tipo, CENTROS[o.centroId]?.nombre || "", CENTROS[o.centroId]?.region || "", o.calif ?? "", o.r1 ?? "", o.r2 ?? "", o.r3 ?? "", o.texto, o.gusto, o.mejora, o.nombre || "Sin nombre"]));
}
/* Listado de personal directo: solo se guarda la cédula cifrada (misma clave del registro) y sus últimos 4 números. */
function leerCedulas(txt) {
  const out = new Set();
  for (const linea of txt.split(/\r?\n/)) {
    const celda = linea.split(/[\t;,]/)[0] || "";
    const c = celda.replace(/\D/g, "");
    if (c.length >= 6 && c.length <= 11) out.add(c);
  }
  return [...out];
}
async function admPersonal(pane) {
  const [hab, ps] = await Promise.all([DB.all("habilitados"), DB.all("participantes")]);
  const H = new Set(hab.map(h => h.id));
  const fuera = ps.filter(p => !H.has(p.id));
  pane.innerHTML = `<section class="card"><h2>Personal directo de ANAVA</h2>
  <p>Solo pueden registrarse las cédulas de este listado. Las cédulas se guardan cifradas: nadie puede leerlas, solo se ven los últimos 4 números.</p>
  <div class="grid2"><div class="card" style="background:#FCFCFC;text-align:center"><div class="estrellas" style="color:var(--azul,#0F2254)">${hab.length}</div>cédulas habilitadas</div>
  <div class="card" style="background:#FCFCFC;text-align:center"><div class="estrellas" style="color:${CFG.lista ? "#1E8A3E" : "var(--rojo)"}">${CFG.lista ? "Activo" : "Inactivo"}</div>control de registro</div></div>
  <label class="check"><input type="checkbox" id="act" ${CFG.lista ? "checked" : ""}> Exigir que la cédula esté en el listado para registrarse</label>
  <h3>Cargar cédulas</h3>
  <p class="muted" style="font-size:13px">Copia de Excel la columna de cédulas (o la tabla con la cédula en la primera columna) y pégala aquí. También puedes subir un archivo .csv o .txt. Se ignoran encabezados, puntos y espacios.</p>
  <textarea id="tx" rows="8" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc" placeholder="1047123456&#10;73123456&#10;..."></textarea>
  <input id="fi" type="file" accept=".csv,.txt,text/plain,text/csv" style="margin-top:8px">
  <label class="check"><input type="checkbox" id="rep"> Reemplazar el listado completo (quita las cédulas que ya no estén, por ejemplo retiros)</label>
  <div id="m"></div><div class="row" style="margin-top:12px"><button class="btn pri" id="cargar">Cargar listado</button></div>
  <h3>Quitar una cédula</h3>
  <div class="row"><input id="qc" inputmode="numeric" placeholder="Número de cédula" style="max-width:220px"><button class="btn no sm" id="quitar">Quitar</button></div><div id="mq"></div>
  ${fuera.length ? `<h3>Registrados que no están en el listado (${fuera.length})</h3><p class="muted" style="font-size:13px">Se registraron antes de cargar el listado o con una cédula que ya se quitó. Revisa si son personal directo.</p>
  <table><thead><tr><th>Nombre</th><th>Centro</th><th>Cédula</th></tr></thead><tbody>${fuera.map(x => `<tr><td>${esc(x.nombre)}</td><td>${esc(CENTROS[x.centroId]?.nombre || "")}</td><td>…${esc(x.cedula4)}</td></tr>`).join("")}</tbody></table>` : ""}
  </section>`;
  $("#act").onchange = async (e) => { await DB.update("config", "app", { lista: e.target.checked }); await cargarBase(); admin("personal"); };
  $("#fi").onchange = async (e) => { const f = e.target.files[0]; if (f) $("#tx").value = await f.text(); };
  $("#cargar").onclick = async () => {
    const lista = leerCedulas($("#tx").value);
    if (!lista.length) return msg($("#m"), "No encontré cédulas válidas (de 6 a 11 números).");
    $("#cargar").disabled = true;
    try {
      const nuevos = new Set();
      for (let i = 0; i < lista.length; i += 25) {
        await Promise.all(lista.slice(i, i + 25).map(async c => { const h = await sha(c, "anava-ced:"); nuevos.add(h); if (!H.has(h)) await DB.set("habilitados", h, { c4: c.slice(-4), ts: ahora() }); }));
        msg($("#m"), `Cargando… ${Math.min(i + 25, lista.length)} de ${lista.length}`, "okb");
      }
      let quitadas = 0;
      if ($("#rep").checked) { const sobran = hab.filter(h => !nuevos.has(h.id)); for (const h of sobran) await DB.del("habilitados", h.id); quitadas = sobran.length; }
      if (!CFG.lista) { await DB.update("config", "app", { lista: true }); await cargarBase(); }
      await admin("personal");
      msg($("#m"), `Listo: ${lista.length} cédulas en el listado${quitadas ? `, ${quitadas} quitadas` : ""}. El control de registro quedó activo.`, "okb");
    } catch (err) { console.error(err); $("#cargar").disabled = false; msg($("#m"), "No se pudo cargar. Revisa tu conexión e intenta otra vez."); }
  };
  $("#quitar").onclick = async () => {
    const c = $("#qc").value.replace(/\D/g, ""); if (c.length < 6) return msg($("#mq"), "Escribe la cédula completa.");
    const h = await sha(c, "anava-ced:");
    if (!H.has(h)) return msg($("#mq"), "Esa cédula no está en el listado.");
    await DB.del("habilitados", h); await admin("personal"); msg($("#mq"), "Cédula quitada del listado.", "okb");
  };
}
function admConfig(pane) {
  pane.innerHTML = `<section class="card"><h2>Fechas de la campaña</h2>
  <div class="grid2"><div><label for="i">Inicio</label><input id="i" type="datetime-local" value="${esc(CFG.inicio)}"></div><div><label for="f">Cierre y ganadores</label><input id="f" type="datetime-local" value="${esc(CFG.fin)}"></div></div>
  <label class="check" style="margin-top:14px"><input type="checkbox" id="pr" ${CFG.pruebas ? "checked" : ""}> Modo pruebas: abre todas las misiones y actividades sin importar la fecha. Desactívalo antes del 1 de diciembre.</label>
  <div id="m"></div><div class="row" style="margin-top:12px"><button class="btn pri" id="g">Guardar</button></div>
  <h3>Calendario de misiones</h3><table><thead><tr><th>Misión o actividad</th><th>Abre</th><th>Estrellas máx.</th></tr></thead><tbody>
  ${[...MISIONES.map(m => [m.titulo, m.abre, maxMision(m)]), ...FOTOS.map(a => [a.titulo + (a.tipo === "texto" ? " (texto" : a.tipo === "red" ? " (redes" : " (foto") + ", hasta " + fmtF(a.cierra) + ")", a.abre, a.tipo === "red" ? "hasta " + maxAct(a) : a.estrellas])].sort((a, b) => a[1].localeCompare(b[1])).map(r => `<tr><td>${esc(r[0])}</td><td>${fmtF(r[1])}</td><td>${r[2]}</td></tr>`).join("")}
  </tbody></table></section>`;
  $("#g").onclick = async () => { await DB.update("config", "app", { inicio: $("#i").value, fin: $("#f").value, pruebas: $("#pr").checked }); await cargarBase(); msg($("#m"), "Guardado.", "okb"); };
}

/* ---------- Arranque ---------- */
$("#lnkInicio").onclick = () => { S.rol = null; inicio(); };
try { await cargarBase(); const h = location.hash.toLowerCase(); if (CFG && (h === "#admin" || h === "#hseq")) login(h.slice(1)); else await inicio(); }
catch (err) { console.error(err); view(`${tito("alto", "Tito", "sm")}<div class="banner err">No se pudo conectar con la base de datos. Revisa tu conexión y vuelve a intentar.</div>`); }
</script>
