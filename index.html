.banner{padding:12px 14px;border-radius:12px;font-weight:600;margin-bottom:12px}

.opc:hover{border-color:var(--navy)}
.opc.bien{border-color:var(--ok);background:#E2F3E6}

.barra{height:10px;background:#E8E8E8;border-radius:99px;overflow:hidden}

footer{text-align:center;color:var(--gris2);font-size:12px;padding:18px}
</style>
</head>

<script type="module">
/* ================== CONFIGURACIÓN ================== */
const firebaseConfig = {
  apiKey: "AIzaSyBzwD7c3joMNwl_WvLVHcSSsRTLCVbDu4A",
  authDomain: "sigue-la-estrella.firebaseapp.com",
  projectId: "sigue-la-estrella",
  storageBucket: "sigue-la-estrella.firebasestorage.app",
  messagingSenderId: "826562823846",
  appId: "1:826562823846:web:fde238c40dbbe471ef9667"
};
/* Misiones de trivia: 5 preguntas, 1 estrella por acierto + 1 si acierta las 5 (la final vale doble). */
const MISIONES = [
  { id: "m1", fase: "Velitas", ico: "🕯️", titulo: "Enciende la prevención", tema: "Pólvora, velas y quemaduras", abre: "2026-12-01T00:00" },
  { id: "m2", fase: "Velitas", ico: "⚡", titulo: "Ronda de chispas", tema: "Luces navideñas, enchufes y extintores", abre: "2026-12-03T00:00" },
  { id: "m3", fase: "Navidad", ico: "⏱️", titulo: "Pausa de 10 segundos", tema: "Las 3 preguntas antes de empezar y el cansancio", abre: "2026-12-10T00:00" },
  { id: "m4", fase: "Navidad", ico: "🎁", titulo: "Cuidarnos es el regalo", tema: "Montacargas, cargas, trago y seguridad en la bodega", abre: "2026-12-16T00:00" },
  { id: "m5", fase: "Año Nuevo", ico: "🦺", titulo: "Agüeros seguros", tema: "Chaleco, viaje seguro, orden y aseo", abre: "2026-12-26T00:00" },
  { id: "m6", fase: "Año Nuevo", ico: "🛣️", titulo: "Ruta Segura 2027", tema: "Reportar lo que está mal y cuidar tu protección", abre: "2026-12-29T00:00" },
  { id: "m7", fase: "Reyes", ico: "👑", titulo: "Regreso seguro", tema: "Volver de vacaciones con cuidado", abre: "2027-01-04T00:00" },
  { id: "m8", fase: "Reyes", ico: "⭐", titulo: "Gran final: Siga la estrella", tema: "Repaso de todo · vale doble", abre: "2027-01-06T00:00", doble: true }
];
/* Actividades revisadas por HSEQ (foto o texto): el HSEQ del centro aprueba y se otorgan las estrellas. */
const FOTOS = [
  { id: "compromiso", fase: "Velitas", ico: "✍️", titulo: "Mi compromiso de temporada", estrellas: 10, abre: "2026-12-01T00:00", cierra: "2026-12-09T23:59", tipo: "texto",
    instr: "Escribe con tus palabras qué vas a hacer para trabajar seguro y llegar sano a casa en esta temporada. Debe ser algo concreto que tú mismo hagas.",
    ejemplos: ["Hago mi inspección preoperacional antes de mover el montacargas, aunque haya afán.", "Uso mi chaleco y mis guantes todo el turno, no solo cuando me ven.", "Si estoy cansado o con sueño, aviso antes de conducir u operar.", "Reporto cualquier condición insegura que vea, el mismo día.", "Respeto los pasillos peatonales y no paso por debajo de cargas."] },
  { id: "familia", fase: "Navidad", ico: "💌", titulo: "Mensaje de mi familia", estrellas: 10, abre: "2026-12-11T00:00", cierra: "2026-12-23T23:59",
    instr: "Lleva la tarjeta a casa, pide a tu familia que escriba o dibuje por qué te espera sano esta Navidad y sube aquí una foto de la tarjeta.", privada: true },
  { id: "muro", fase: "Año Nuevo", ico: "📸", titulo: "Muro del orgullo operativo", estrellas: 10, abre: "2026-12-28T00:00", cierra: "2027-01-06T23:59",
    instr: "Haz tu aporte en el Muro del orgullo operativo de tu centro (foto, mensaje o compromiso) y sube aquí una foto donde se vea tu aporte." }
];
const PREG = 5, SEG = 30;
const FASES = ["Velitas", "Navidad", "Año Nuevo", "Reyes"];
/* ================================================== */

const DEMO = !firebaseConfig.apiKey || firebaseConfig.apiKey === "PEGAR_AQUI";
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rid = (n = 10) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
async function sha(t, sal = "anava-estrella:") { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(sal + t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
const fmtF = (s) => new Date(s).toLocaleDateString("es-CO", { weekday: "short", day: "numeric", month: "short" });
const tito = (n, alt, cls = "") => `<img class="tito ${cls}" src="tito-${n}.png?v=nav1" alt="${esc(alt)}" onerror="this.remove()">`;
const corto = (n) => { const p = String(n || "").trim().split(/\s+/); return p[0] + (p[1] ? " " + p[1][0] + "." : ""); };
const LS = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };

/* ---------- Datos: demo (localStorage) o Firestore ---------- */
let DB;
if (DEMO) {
  const K = "siga-estrella-v2-demo";
  const load = () => { try { return JSON.parse(localStorage.getItem(K)) || {}; } catch { return {}; } };
  const save = (d) => { try { localStorage.setItem(K, JSON.stringify(d)); } catch { alert("El navegador no deja guardar más datos de prueba."); } };
  DB = {
    async get(c, id) { return (load()[c] || {})[id] || null; },
    async set(c, id, v) { const d = load(); d[c] = d[c] || {}; d[c][id] = { ...v, id }; save(d); },
    async update(c, id, v) { const d = load(); d[c] = d[c] || {}; d[c][id] = { ...(d[c][id] || {}), ...v, id }; save(d); },
    async inc(c, id, campos) { const d = load(); const o = d[c][id]; for (const k in campos) o[k] = (o[k] || 0) + campos[k]; save(d); },
    async del(c, id) { const d = load(); if (d[c]) delete d[c][id]; save(d); },
    async where(c, f, v) { return Object.values(load()[c] || {}).filter(x => x[f] === v); },
    async all(c) { return Object.values(load()[c] || {}); },
    async top(c, f, n) { return Object.values(load()[c] || {}).sort((a, b) => (b[f] || 0) - (a[f] || 0)).slice(0, n); }
  };
} else {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const db = fs.getFirestore(initializeApp(firebaseConfig));
  const snap = (s) => s.docs.map(d => ({ ...d.data(), id: d.id }));
  DB = {
    async get(c, id) { const s = await fs.getDoc(fs.doc(db, c, id)); return s.exists() ? { ...s.data(), id: s.id } : null; },
    async set(c, id, v) { await fs.setDoc(fs.doc(db, c, id), v); },
    async update(c, id, v) { await fs.updateDoc(fs.doc(db, c, id), v); },
    async inc(c, id, campos) { const u = {}; for (const k in campos) u[k] = fs.increment(campos[k]); await fs.updateDoc(fs.doc(db, c, id), u); },
    async del(c, id) { await fs.deleteDoc(fs.doc(db, c, id)); },
    async where(c, f, v) { return snap(await fs.getDocs(fs.query(fs.collection(db, c), fs.where(f, "==", v)))); },
    async all(c) { return snap(await fs.getDocs(fs.collection(db, c))); },
    async top(c, f, n) { return snap(await fs.getDocs(fs.query(fs.collection(db, c), fs.orderBy(f, "desc"), fs.limit(n)))); }
  };
}

/* ---------- Estado ---------- */
const S = { rol: null, centroId: null, pid: LS.get("sle-pid") };
let CFG = null, CENTROS = {};
async function cargarBase() {
  CFG = await DB.get("config", "app");
  if (CFG && !CFG.v2) { const up = { inicio: "2026-12-01T00:00", fin: "2027-01-09T12:00", pruebas: false, v2: true }; await DB.update("config", "app", up); CFG = { ...CFG, ...up }; }
  CENTROS = Object.fromEntries((await DB.all("centros")).map(c => [c.id, c]));
}
const ahora = () => Date.now();
const enCampana = () => CFG && (CFG.pruebas || (ahora() >= Date.parse(CFG.inicio) && ahora() <= Date.parse(CFG.fin)));
const terminada = () => CFG && !CFG.pruebas && ahora() > Date.parse(CFG.fin);
const abierta = (m) => CFG && !terminada() && (CFG.pruebas || ahora() >= Date.parse(m.abre)) && (CFG.pruebas || ahora() <= Date.parse(m.cierra || CFG.fin));
const maxMision = (m) => (PREG + 1) * (m.doble ? 2 : 1);
function view(html) { app.innerHTML = (DEMO ? `<div class="banner demo">Modo demostración: los datos se guardan solo en este navegador.</div>` : "") + (CFG?.pruebas ? `<div class="banner demo">Modo pruebas activo: todas las misiones están abiertas.</div>` : "") + html; window.scrollTo(0, 0); }
function msg(el, t, tipo = "err") { el.innerHTML = `<div class="banner ${tipo}" role="alert">${esc(t)}</div>`; }
function comprimir(file) {
  return new Promise((res) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 900 / Math.max(img.width, img.height)); const cv = document.createElement("canvas"); cv.width = img.width * k; cv.height = img.height * k; cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", 0.6)); };
    img.onerror = () => res(null); img.src = url;
  });
}
const ordenRank = (a, b) => (b.estrellas || 0) - (a.estrellas || 0) || (a.segundos || 0) - (b.segundos || 0) || (a.ultimo || 0) - (b.ultimo || 0);
const valido = (p) => p && CENTROS[p.centroId] && !CENTROS[p.centroId].prueba;

/* ================== PARTICIPANTE ================== */
async function inicio() {
  if (!CFG) return primerUso();
  if (S.pid) { const p = await DB.get("participantes", S.pid); if (p) return panel(p); S.pid = null; LS.del("sle-pid"); }
  view(`
  <section class="card hero">${tito("inicio", "Tito señala hacia la estrella")}
    <h1>¡Siga la estrella!</h1>
    <p>Del 1 de diciembre al 9 de enero responde misiones, junta estrellas y gana. Hay un ganador en todo el país y un ganador en cada centro de trabajo.</p>
  </section>
  <section class="card">
    <h2>Entra con tu cédula</h2>
    <label for="ced">Número de cédula</label>
    <input id="ced" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Solo números">
    <div id="m"></div>
    <div class="row" style="margin-top:12px"><button class="btn pri full" id="ent">Entrar</button></div>
    <p class="muted" style="font-size:13px">Tu cédula se guarda en clave: nadie puede verla completa. Solo se muestran los últimos 4 números.</p>
  </section>
  <div class="row"><button class="btn sec" id="bRank">Ver ranking</button><button class="btn sec" id="bHseq">Soy HSEQ de centro</button><button class="btn sec" id="bAdm">Administración</button></div>`);
  $("#ced").onkeydown = (e) => { if (e.key === "Enter") $("#ent").click(); };
  $("#ent").onclick = async () => {
    const c = $("#ced").value.replace(/\D/g, "");
    if (c.length < 6 || c.length > 11) return msg($("#m"), "Escribe tu número de cédula completo, solo números.");
    const pid = await sha(c, "anava-ced:");
    const p = await DB.get("participantes", pid);
    if (p) { S.pid = pid; LS.set("sle-pid", pid); return panel(p); }
    if (CFG.lista && !(await DB.get("habilitados", pid))) return msg($("#m"), "Tu cédula no aparece en el listado de personal directo de ANAVA. Revisa el número y, si eres trabajador directo, habla con el HSEQ de tu centro.");
    registro(pid, c.slice(-4));
  };
  $("#bRank").onclick = ranking; $("#bHseq").onclick = () => login("hseq"); $("#bAdm").onclick = () => login("admin");
}

function registro(pid, c4) {
  const cs = Object.values(CENTROS).sort((a, b) => a.nombre.localeCompare(b.nombre));
  view(`<section class="card">${tito("inicio", "Tito te da la bienvenida", "sm")}
  <h1>Regístrate una sola vez</h1><p class="muted">Cédula terminada en <b>${esc(c4)}</b></p>
  <label for="nom">Nombre y apellido</label><input id="nom" maxlength="60" autocomplete="name">
  <label for="cen">Centro de trabajo</label><select id="cen"><option value="">Selecciona tu centro…</option>${cs.map(c => `<option value="${esc(c.id)}">${esc(c.nombre)}</option>`).join("")}</select>
  <label class="check"><input type="checkbox" id="aut"> Autorizo a ANAVA a usar mi nombre, mi centro de trabajo y mi cédula (guardada en clave) solo para esta campaña y la entrega de premios (Ley 1581 de 2012).</label>
  <div id="m"></div>
  <div class="row" style="margin-top:12px"><button class="btn pri" id="ok">Registrarme</button><button class="btn sec" id="vol">Volver</button></div></section>`);
  $("#vol").onclick = inicio;
  $("#ok").onclick = async () => {
    const nom = $("#nom").value.trim(), cen = $("#cen").value;
    if (nom.split(/\s+/).length < 2) return msg($("#m"), "Escribe tu nombre y apellido.");
    if (!cen) return msg($("#m"), "Selecciona tu centro de trabajo.");
    if (!$("#aut").checked) return msg($("#m"), "Debes autorizar el tratamiento de datos para participar.");
    $("#ok").disabled = true;
    await DB.set("participantes", pid, { nombre: nom, centroId: cen, cedula4: c4, estrellas: 0, segundos: 0, ultimo: 0, creado: ahora() });
    S.pid = pid; LS.set("sle-pid", pid); panel(await DB.get("participantes", pid));
  };
}

async function panel(p) {
  const [ints, fotos] = await Promise.all([DB.where("intentos", "pid", p.id), DB.where("fotos", "pid", p.id)]);
  const I = Object.fromEntries(ints.map(x => [x.mision, x])), F = Object.fromEntries(fotos.map(x => [x.actividad, x]));
  const c = CENTROS[p.centroId];
  const item = (a, tipo) => {
    const ab = abierta(a), it = tipo === "m" ? I[a.id] : F[a.id];
    let est, cls = "", btn = "";
    if (tipo === "m") {
      if (it?.estado === "terminado") { est = `<span class="tag val">${it.estrellas} de ${maxMision(a)} ⭐</span>`; cls = "hecha"; }
      else if (it) { est = `<span class="tag pend">En curso</span>`; btn = `<button class="btn pri sm" data-m="${a.id}">Continuar</button>`; cls = "abierta"; }
      else if (ab) { est = `<span class="tag pend">Hasta ${maxMision(a)} ⭐</span>`; btn = `<button class="btn pri sm" data-m="${a.id}">Jugar</button>`; cls = "abierta"; }
      else est = terminada() ? `<span class="tag lock">Cerrada</span>` : `<span class="tag lock">Abre ${fmtF(a.abre)}</span>`;
    } else {
      if (it?.estado === "aprobada") { est = `<span class="tag val">Aprobada · ${a.estrellas} ⭐</span>`; cls = "hecha"; }

/* ---------- Trivia ---------- */
function bancoDe(m) {
  if (m.id !== "m8") return (window.BANCO[m.id] || []).map((q, i) => ({ k: m.id + ":" + i, q }));
  return Object.keys(window.BANCO).flatMap(id => window.BANCO[id].map((q, i) => ({ k: id + ":" + i, q })));
}
const pregDe = (k) => { const [id, i] = k.split(":"); return window.BANCO[id][+i]; };
function mezclar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

async function trivia(p, m) {
  if (!abierta(m)) return panel(p);
  const iid = p.id + "_" + m.id;
  let it = await DB.get("intentos", iid);
  if (it?.estado === "terminado") return panel(p);
  if (!it) {
    view(`<section class="card hero"><div style="font-size:54px" aria-hidden="true">${m.ico}</div><h1>${esc(m.titulo)}</h1><p>${esc(m.tema)}</p></section>
    <section class="card"><ul><li><b>${PREG} preguntas</b>, ${SEG} segundos cada una.</li><li><b>Una sola oportunidad.</b> Si se cierra la app, sigues donde ibas.</li><li>Hasta <b>${maxMision(m)} estrellas</b>${m.doble ? " (esta misión vale doble)" : ""}.</li></ul>
    <div class="row"><button class="btn pri" id="go">Empezar</button><button class="btn sec" id="vol">Volver</button></div></section>`);
    $("#vol").onclick = () => panel(p);
    $("#go").onclick = async () => {
      $("#go").disabled = true;
      const qs = mezclar(bancoDe(m)).slice(0, PREG).map(x => x.k);
      const ords = qs.map(() => mezclar([0, 1, 2, 3]));
      it = { pid: p.id, centroId: p.centroId, mision: m.id, qs, ords: ords.map(o => o.join("")), idx: 0, correctas: 0, segundos: 0, estado: "en curso", inicio: ahora() };
      await DB.set("intentos", iid, it); pregunta(p, m, iid, it);
    };
    return;
  }
  pregunta(p, m, iid, it);
}

function pregunta(p, m, iid, it) {
  if (it.idx >= it.qs.length) return terminar(p, m, iid, it);
  const [q, ops, ok, exp] = pregDe(it.qs[it.idx]);
  const ord = String(it.ords[it.idx]).split("").map(Number);
  let resto = SEG, listo = false; const t0 = ahora();
  view(`<section class="card">
    <div class="row" style="justify-content:space-between"><b>${esc(m.titulo)} · Pregunta ${it.idx + 1} de ${it.qs.length}</b><span class="reloj" id="rel" aria-live="off">${SEG}s</span></div>
    <div class="barra" style="margin:10px 0"><div style="width:${(it.idx / it.qs.length) * 100}%"></div></div>
    <h2 style="margin-top:14px">${esc(q)}</h2>
    <div id="ops">${ord.map(i => `<button class="opc" data-i="${i}">${esc(ops[i])}</button>`).join("")}</div>
    <div id="fb"></div></section>`);
  const tick = setInterval(() => { resto--; const r = $("#rel"); if (!r) return clearInterval(tick); r.textContent = resto + "s"; if (resto <= 10) r.classList.add("bajo"); if (resto <= 0) responder(-1); }, 1000);
  async function responder(i) {
    if (listo) return; listo = true; clearInterval(tick);
    const bien = i === ok, seg = Math.min(SEG, Math.round((ahora() - t0) / 1000));
    app.querySelectorAll(".opc").forEach(b => { b.disabled = true; if (+b.dataset.i === ok) b.classList.add("bien"); else if (+b.dataset.i === i) b.classList.add("mal"); });
    it.idx++; it.correctas += bien ? 1 : 0; it.segundos += i === -1 ? SEG : seg;
    await DB.update("intentos", iid, { idx: it.idx, correctas: it.correctas, segundos: it.segundos });
    $("#fb").innerHTML = `<div class="banner ${bien ? "okb" : "err"}" style="margin-top:12px">${i === -1 ? "Se acabó el tiempo. " : bien ? "¡Correcto! " : "No es correcta. "}${esc(exp)}</div><button class="btn pri full" id="sig">${it.idx >= it.qs.length ? "Ver resultado" : "Siguiente pregunta"}</button>`;
    $("#sig").onclick = () => pregunta(p, m, iid, it);
  }
  app.querySelectorAll(".opc").forEach(b => b.onclick = () => responder(+b.dataset.i));
}

async function terminar(p, m, iid, it) {
  if (it.estado !== "terminado") {
    const mult = m.doble ? 2 : 1;
    const est = (it.correctas + (it.correctas === it.qs.length ? 1 : 0)) * mult;
    it.estado = "terminado"; it.estrellas = est;
    await DB.update("intentos", iid, { estado: "terminado", estrellas: est, fin: ahora() });
    await DB.inc("participantes", p.id, { estrellas: est, segundos: it.segundos });
    await DB.update("participantes", p.id, { ultimo: ahora() });
  }
  const pp = await DB.get("participantes", p.id);
  view(`<section class="card hero">${tito(it.estrellas > 0 ? "enviado" : "alto", "Tito")}
    <h1>${it.correctas === it.qs.length ? "¡Misión perfecta!" : "¡Misión completada!"}</h1>
    <p>${it.correctas} de ${it.qs.length} respuestas correctas</p>
    <div class="estrellas">+${it.estrellas} ⭐</div><p>Ahora tienes <b>${pp.estrellas} estrellas</b></p></section>
    <button class="btn pri full" id="vol">Volver a mis misiones</button>`);
  $("#vol").onclick = () => panel(pp);
}

    const ps = (await DB.where("participantes", "centroId", c.id)).sort(ordenRank);

    <p class="muted" style="margin:4px 0">${esc(f.nombre)} · ${new Date(f.ts).toLocaleString("es-CO", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })}</p>
    <p style="font-size:13px" class="muted">Criterio: ${esc(a.instr)}</p>
    ${f.foto ? `<img class="foto" src="${f.foto}" alt="Foto enviada por ${esc(f.nombre)}">` : ""}${f.texto ? `<blockquote style="margin:8px 0;padding:10px 12px;background:#fff;border-left:4px solid var(--rojo);border-radius:6px">«${esc(f.texto)}»</blockquote>` : ""}
    ${f.estado === "pendiente" ? `<div class="row"><button class="btn ok sm" data-ok="${esc(f.id)}">Aprobar (+${a.estrellas} ⭐)</button><button class="btn no sm" data-no="${esc(f.id)}">Rechazar</button></div><div id="r-${esc(f.id)}"></div>` : f.motivo ? `<p>Motivo: ${esc(f.motivo)}</p>` : ""}
  </div>`; }).join("") : `${tito("hseq", "Tito", "sm")}<p class="muted" style="text-align:center">${tab === "fotos" ? "No hay nada pendiente por revisar." : "Aún no has revisado nada."}</p>`}</section>`;
  pane.querySelectorAll("[data-ok]").forEach(b => b.onclick = async () => {
    b.disabled = true; const f = lista.find(x => x.id === b.dataset.ok); const a = FOTOS.find(x => x.id === f.actividad);

  });
}

async function admin(tab = "resumen") {
  view(encabezado("Administración nacional", "¡Siga la estrella! · todos los centros", [["resumen", "Resumen"], ["ganadores", "Ganadores"], ["centros", "Centros"], ["personal", "Personal directo"], ["config", "Fechas y pruebas"]], tab));
  $("#salir").onclick = () => { S.rol = null; inicio(); };
  app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => admin(b.dataset.t));
  const pane = $("#pane");
  if (tab === "centros") return admCentros(pane);
  if (tab === "config") return admConfig(pane);
  if (tab === "personal") return admPersonal(pane);
  const [ps, fotos, ints] = await Promise.all([DB.all("participantes"), DB.all("fotos"), DB.all("intentos")]);
  if (tab === "ganadores") return admGanadores(pane, ps);
  const filas = Object.values(CENTROS).sort((a, b) => a.nombre.localeCompare(b.nombre)).map(c => {
    const p = ps.filter(x => x.centroId === c.id);
    return { c, part: p.length, est: p.reduce((s, x) => s + (x.estrellas || 0), 0), mis: ints.filter(x => x.centroId === c.id && x.estado === "terminado").length, pend: fotos.filter(x => x.centroId === c.id && x.estado === "pendiente").length };
  });
  pane.innerHTML = `<div class="grid2" style="margin-bottom:12px">
    <div class="card"><div class="estrellas" style="color:var(--rojo)">${ps.filter(valido).length}</div>participantes</div>
    <div class="card"><div class="estrellas" style="color:var(--rojo)">${ints.filter(x => x.estado === "terminado").length}</div>misiones completadas</div>
    <div class="card"><div class="estrellas" style="color:var(--rojo)">${fotos.filter(x => x.estado === "pendiente").length}</div>por revisar (fotos y compromisos)</div></div>
  <section class="card"><h2>Avance por centro</h2><table><thead><tr><th>Centro</th><th>Participantes</th><th>Misiones</th><th>Fotos pendientes</th><th>Estrellas</th></tr></thead><tbody>
  ${filas.map(f => `<tr><td>${esc(f.c.nombre)}${f.c.prueba ? ` <span class="tag lock">prueba</span>` : ""}<br><small class="muted">${esc(f.c.region || "")}</small></td><td>${f.part}</td><td>${f.mis}</td><td>${f.pend ? `<span class="tag pend">${f.pend}</span>` : "0"}</td><td><b>${f.est}</b></td></tr>`).join("") || `<tr><td colspan="5" class="muted">Crea los centros en la pestaña Centros.</td></tr>`}
  </tbody></table><div class="row" style="margin-top:12px"><button class="btn oro" id="csv">Descargar participantes (CSV)</button></div></section>`;
  $("#csv").onclick = () => csv("participantes-siga-la-estrella.csv", ["Centro", "Región", "Nombre", "Cédula (últimos 4)", "Estrellas", "Segundos en trivias", "Prueba"], ps.sort(ordenRank).map(x => [CENTROS[x.centroId]?.nombre, CENTROS[x.centroId]?.region, x.nombre, x.cedula4, x.estrellas, x.segundos, CENTROS[x.centroId]?.prueba ? "Sí" : "No"]));
}
function csv(nombre, head, rows) {
  const t = "﻿" + [head, ...rows].map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/csv;charset=utf-8" })); a.download = nombre; a.click();
}
function ganadores(ps) {
  const v = ps.filter(valido).filter(x => x.estrellas > 0).sort(ordenRank);
  const nacional = v[0] || null;
  const porCentro = Object.values(CENTROS).filter(c => !c.prueba).map(c => ({ c, g: v.find(x => x.centroId === c.id && x.id !== nacional?.id) || null }));
  return { nacional, porCentro };
}
function admGanadores(pane, ps) {
  const { nacional, porCentro } = ganadores(ps);
  pane.innerHTML = `<section class="card"><h2>${terminada() ? "Ganadores oficiales" : "Ganadores parciales (a hoy)"}</h2>
  <p class="muted">Criterio: más estrellas; si hay empate, menos tiempo total en trivias; si sigue el empate, quien completó primero. Si el ganador nacional es también el primero de su centro, el premio del centro pasa al siguiente.</p>
  <h3>🏆 Ganador nacional</h3>${nacional ? `<p><b>${esc(nacional.nombre)}</b> · ${esc(CENTROS[nacional.centroId]?.nombre)} · cédula …${esc(nacional.cedula4)} · <b>${nacional.estrellas} ⭐</b></p>` : `<p class="muted">Sin participantes con estrellas.</p>`}
  <h3>⭐ Ganador por centro</h3><table><thead><tr><th>Centro</th><th>Ganador</th><th>Cédula</th><th>Estrellas</th></tr></thead><tbody>
  ${porCentro.map(x => `<tr><td>${esc(x.c.nombre)}</td><td>${x.g ? esc(x.g.nombre) : `<span class="muted">Sin participantes</span>`}</td><td>${x.g ? "…" + esc(x.g.cedula4) : ""}</td><td>${x.g ? `<b>${x.g.estrellas}</b>` : ""}</td></tr>`).join("")}
  </tbody></table><div class="row" style="margin-top:12px"><button class="btn oro" id="csv">Descargar ganadores (CSV)</button></div></section>`;
  $("#csv").onclick = () => csv("ganadores-siga-la-estrella.csv", ["Premio", "Centro", "Nombre", "Cédula (últimos 4)", "Estrellas"], [nacional ? ["Nacional", CENTROS[nacional.centroId]?.nombre, nacional.nombre, nacional.cedula4, nacional.estrellas] : ["Nacional", "", "", "", ""], ...porCentro.map(x => ["Centro", x.c.nombre, x.g?.nombre || "", x.g?.cedula4 || "", x.g?.estrellas || ""])]);
}
async function admCentros(pane) {
  const cs = Object.values(CENTROS).sort((a, b) => a.nombre.localeCompare(b.nombre));
  pane.innerHTML = `<section class="card"><h2>Centros de trabajo</h2>
  <div class="grid2"><div><label for="n">Nombre del centro</label><input id="n" placeholder="Ej.: Parquiamérica"></div>
  <div><label for="r">Región</label><select id="r"><option>Caribe</option><option>Suroccidente</option><option>Centro</option><option>Antioquia</option></select></div>
  <div><label for="pc">PIN del HSEQ del centro (mín. 4 dígitos)</label><input id="pc" inputmode="numeric"></div></div>
  <label class="check"><input type="checkbox" id="pr"> Centro de prueba (no cuenta para ranking ni ganadores)</label>
  <div id="m"></div><div class="row" style="margin-top:12px"><button class="btn pri" id="add">Agregar centro</button></div>
  <h3>Cargar varios centros a la vez</h3>
  <p class="muted" style="font-size:13px">Una línea por centro: <b>Nombre del centro; Región</b>. Regiones: Caribe, Suroccidente, Centro o Antioquia. Puedes pegar dos columnas copiadas de Excel. La app crea un PIN de 6 dígitos para cada centro nuevo; los centros que ya existen se omiten.</p>
  <textarea id="lote" rows="6" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc" placeholder="Parquiamérica; Caribe&#10;PMI Cali; Suroccidente"></textarea>
  <div id="ml"></div><div class="row" style="margin-top:10px"><button class="btn pri" id="crearLote">Crear centros y generar PIN</button></div><div id="pines"></div>
  <h3>Inscritos (${cs.length})</h3><table><thead><tr><th>Centro</th><th>Región</th><th></th></tr></thead><tbody>
  ${cs.map(c => `<tr><td>${esc(c.nombre)}${c.prueba ? ` <span class="tag lock">prueba</span>` : ""}</td><td>${esc(c.region || "")}</td><td><div class="row"><button class="btn sec sm" data-pin="${esc(c.id)}">Cambiar PIN</button><button class="btn no sm" data-del="${esc(c.id)}">Eliminar</button></div><div id="x-${esc(c.id)}"></div></td></tr>`).join("") || `<tr><td colspan="3" class="muted">Sin centros todavía.</td></tr>`}
  </tbody></table></section>`;
  $("#add").onclick = async () => {
    const n = $("#n").value.trim(), p = $("#pc").value.trim();
    if (!n) return msg($("#m"), "Escribe el nombre del centro.");
    if (p.length < 4) return msg($("#m"), "El PIN debe tener al menos 4 dígitos.");
    if (cs.some(c => c.nombre.toLowerCase() === n.toLowerCase())) return msg($("#m"), "Ese centro ya existe.");
    await DB.set("centros", rid(8), { nombre: n, region: $("#r").value, pin: await sha(p), prueba: $("#pr").checked });
    await cargarBase(); admin("centros");
  };
  $("#crearLote").onclick = async () => {
    const REG = { caribe: "Caribe", suroccidente: "Suroccidente", centro: "Centro", antioquia: "Antioquia" };
    const filas = $("#lote").value.split(/\r?\n/).map(l => l.split(/[;\t]/).map(x => x.trim())).filter(x => x[0]);
    if (!filas.length) return msg($("#ml"), "Pega al menos un centro.");
    const malos = filas.filter(f => !REG[(f[1] || "").toLowerCase()]);
    if (malos.length) return msg($("#ml"), "Revisa la región de: " + malos.map(f => f[0]).join(", ") + ". Usa Caribe, Suroccidente, Centro o Antioquia.");
    $("#crearLote").disabled = true;
    const existentes = new Set(cs.map(c => c.nombre.toLowerCase())), creados = [], omitidos = [];
    for (const [nom, reg] of filas) {
      if (existentes.has(nom.toLowerCase())) { omitidos.push(nom); continue; }
      const n = new Uint32Array(1); crypto.getRandomValues(n); const pin = String(100000 + (n[0] % 900000));
      await DB.set("centros", rid(8), { nombre: nom, region: REG[reg.toLowerCase()], pin: await sha(pin), prueba: false });
      existentes.add(nom.toLowerCase()); creados.push([nom, REG[reg.toLowerCase()], pin]);
    }
    await cargarBase(); await admin("centros");
    if (!creados.length) return msg($("#ml"), "No se creó ningún centro: ya existían todos.", "okb");
    $("#pines").innerHTML = `<div class="card" style="background:#FFF8E1;margin-top:10px"><b>Guarda estos PIN ahora.</b> Por seguridad la app no vuelve a mostrarlos; si se pierde uno, usa «Cambiar PIN».
      <table style="margin-top:8px"><thead><tr><th>Centro</th><th>Región</th><th>PIN</th></tr></thead><tbody>${creados.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td><b>${r[2]}</b></td></tr>`).join("")}</tbody></table>
      ${omitidos.length ? `<p class="muted" style="font-size:13px">Ya existían: ${esc(omitidos.join(", "))}</p>` : ""}
      <div class="row" style="margin-top:8px"><button class="btn oro" id="dlp">Descargar PIN (CSV)</button></div></div>`;
    $("#dlp").onclick = () => csv("pines-hseq-centros.csv", ["Centro", "Región", "PIN"], creados);
    $("#dlp").click();
  };
  pane.querySelectorAll("[data-pin]").forEach(b => b.onclick = () => {
    const box = $("#x-" + CSS.escape(b.dataset.pin));
    box.innerHTML = `<div class="row" style="margin-top:6px"><input id="np" inputmode="numeric" placeholder="Nuevo PIN" style="max-width:160px"><button class="btn pri sm" id="gp">Guardar</button></div>`;
    $("#gp").onclick = async () => { const p = $("#np").value.trim(); if (p.length < 4) return; await DB.update("centros", b.dataset.pin, { pin: await sha(p) }); await cargarBase(); admin("centros"); };
  });
  pane.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const box = $("#x-" + CSS.escape(b.dataset.del));
    box.innerHTML = `<div class="row" style="margin-top:6px"><span class="muted" style="font-size:13px">¿Eliminar? Sus participantes quedarán sin centro.</span><button class="btn no sm" id="cd">Sí, eliminar</button></div>`;
    $("#cd").onclick = async () => { await DB.del("centros", b.dataset.del); await cargarBase(); admin("centros"); };
  });
}
/* Listado de personal directo: solo se guarda la cédula cifrada (misma clave del registro) y sus últimos 4 números. */
function leerCedulas(txt) {
  const out = new Set();
  for (const linea of txt.split(/\r?\n/)) {
    const celda = linea.split(/[\t;,]/)[0] || "";
    const c = celda.replace(/\D/g, "");
    if (c.length >= 6 && c.length <= 11) out.add(c);
  }
  return [...out];
}
async function admPersonal(pane) {
  const [hab, ps] = await Promise.all([DB.all("habilitados"), DB.all("participantes")]);
  const H = new Set(hab.map(h => h.id));
  const fuera = ps.filter(p => !H.has(p.id));
  pane.innerHTML = `<section class="card"><h2>Personal directo de ANAVA</h2>
  <p>Solo pueden registrarse las cédulas de este listado. Las cédulas se guardan cifradas: nadie puede leerlas, solo se ven los últimos 4 números.</p>
  <div class="grid2"><div class="card" style="background:#FCFCFC;text-align:center"><div class="estrellas" style="color:var(--azul,#0F2254)">${hab.length}</div>cédulas habilitadas</div>
  <div class="card" style="background:#FCFCFC;text-align:center"><div class="estrellas" style="color:${CFG.lista ? "#1E8A3E" : "var(--rojo)"}">${CFG.lista ? "Activo" : "Inactivo"}</div>control de registro</div></div>
  <label class="check"><input type="checkbox" id="act" ${CFG.lista ? "checked" : ""}> Exigir que la cédula esté en el listado para registrarse</label>
  <h3>Cargar cédulas</h3>
  <p class="muted" style="font-size:13px">Copia de Excel la columna de cédulas (o la tabla con la cédula en la primera columna) y pégala aquí. También puedes subir un archivo .csv o .txt. Se ignoran encabezados, puntos y espacios.</p>
  <textarea id="tx" rows="8" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc" placeholder="1047123456&#10;73123456&#10;..."></textarea>
  <input id="fi" type="file" accept=".csv,.txt,text/plain,text/csv" style="margin-top:8px">
  <label class="check"><input type="checkbox" id="rep"> Reemplazar el listado completo (quita las cédulas que ya no estén, por ejemplo retiros)</label>
  <div id="m"></div><div class="row" style="margin-top:12px"><button class="btn pri" id="cargar">Cargar listado</button></div>
  <h3>Quitar una cédula</h3>
  <div class="row"><input id="qc" inputmode="numeric" placeholder="Número de cédula" style="max-width:220px"><button class="btn no sm" id="quitar">Quitar</button></div><div id="mq"></div>
  ${fuera.length ? `<h3>Registrados que no están en el listado (${fuera.length})</h3><p class="muted" style="font-size:13px">Se registraron antes de cargar el listado o con una cédula que ya se quitó. Revisa si son personal directo.</p>
  <table><thead><tr><th>Nombre</th><th>Centro</th><th>Cédula</th></tr></thead><tbody>${fuera.map(x => `<tr><td>${esc(x.nombre)}</td><td>${esc(CENTROS[x.centroId]?.nombre || "")}</td><td>…${esc(x.cedula4)}</td></tr>`).join("")}</tbody></table>` : ""}
  </section>`;
  $("#act").onchange = async (e) => { await DB.update("config", "app", { lista: e.target.checked }); await cargarBase(); admin("personal"); };
  $("#fi").onchange = async (e) => { const f = e.target.files[0]; if (f) $("#tx").value = await f.text(); };
  $("#cargar").onclick = async () => {
    const lista = leerCedulas($("#tx").value);
    if (!lista.length) return msg($("#m"), "No encontré cédulas válidas (de 6 a 11 números).");
    $("#cargar").disabled = true;
    try {
      const nuevos = new Set();
      for (let i = 0; i < lista.length; i += 25) {
        await Promise.all(lista.slice(i, i + 25).map(async c => { const h = await sha(c, "anava-ced:"); nuevos.add(h); if (!H.has(h)) await DB.set("habilitados", h, { c4: c.slice(-4), ts: ahora() }); }));
        msg($("#m"), `Cargando… ${Math.min(i + 25, lista.length)} de ${lista.length}`, "okb");
      }
      let quitadas = 0;
      if ($("#rep").checked) { const sobran = hab.filter(h => !nuevos.has(h.id)); for (const h of sobran) await DB.del("habilitados", h.id); quitadas = sobran.length; }
      if (!CFG.lista) { await DB.update("config", "app", { lista: true }); await cargarBase(); }
      await admin("personal");
      msg($("#m"), `Listo: ${lista.length} cédulas en el listado${quitadas ? `, ${quitadas} quitadas` : ""}. El control de registro quedó activo.`, "okb");
    } catch (err) { console.error(err); $("#cargar").disabled = false; msg($("#m"), "No se pudo cargar. Revisa tu conexión e intenta otra vez."); }
  };
  $("#quitar").onclick = async () => {
    const c = $("#qc").value.replace(/\D/g, ""); if (c.length < 6) return msg($("#mq"), "Escribe la cédula completa.");
    const h = await sha(c, "anava-ced:");
    if (!H.has(h)) return msg($("#mq"), "Esa cédula no está en el listado.");
    await DB.del("habilitados", h); await admin("personal"); msg($("#mq"), "Cédula quitada del listado.", "okb");
  };
}

  pane.innerHTML = `<section class="card"><h2>Fechas de la campaña</h2>
  <div class="grid2"><div><label for="i">Inicio</label><input id="i" type="datetime-local" value="${esc(CFG.inicio)}"></div><div><label for="f">Cierre y ganadores</label><input id="f" type="datetime-local" value="${esc(CFG.fin)}"></div></div>
  <label class="check" style="margin-top:14px"><input type="checkbox" id="pr" ${CFG.pruebas ? "checked" : ""}> Modo pruebas: abre todas las misiones y actividades sin importar la fecha. Desactívalo antes del 1 de diciembre.</label>

  <h3>Calendario de misiones</h3><table><thead><tr><th>Misión o actividad</th><th>Abre</th><th>Estrellas máx.</th></tr></thead><tbody>
  ${[...MISIONES.map(m => [m.titulo, m.abre, maxMision(m)]), ...FOTOS.map(a => [a.titulo + (a.tipo === "texto" ? " (texto" : " (foto") + ", hasta " + fmtF(a.cierra) + ")", a.abre, a.estrellas])].sort((a, b) => a[1].localeCompare(b[1])).map(r => `<tr><td>${esc(r[0])}</td><td>${fmtF(r[1])}</td><td>${r[2]}</td></tr>`).join("")}
  </tbody></table></section>`;
  $("#g").onclick = async () => { await DB.update("config", "app", { inicio: $("#i").value, fin: $("#f").value, pruebas: $("#pr").checked }); await cargarBase(); msg($("#m"), "Guardado.", "okb"); };
}
